<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Invasores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Press Start 2P',ui-monospace,monospace;color:#fff}
#c{display:block;position:fixed;inset:0}
#sb{position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);pointer-events:none}
/* botón de pausa (encima del juego, debajo de los menús) */
#pz{position:fixed;left:12px;top:60px;width:38px;height:38px;display:none;align-items:center;justify-content:center;gap:6px;border:2px solid #4a5656;background:rgba(0,0,0,.35);touch-action:none;cursor:pointer;box-sizing:border-box}
#pz.show{display:flex}
#pz i{display:block;width:5px;height:14px;background:#c8d0d0}
#pz:active{transform:translate(1px,1px)}
.eq{width:min(340px,92vw);display:flex;flex-direction:column;gap:6px;text-align:left}
.eq .row{display:flex;gap:10px;align-items:center;border:2px solid #333;padding:6px 8px}
.eq canvas{width:28px;height:28px;image-rendering:pixelated;flex:none}
.eq .nm{font-size:9px}
.eq .ds{margin-top:4px}
/* desbloqueos al acabar: solo iconos, se tocan para ver qué hacen */
.unl{display:flex;flex-wrap:wrap;gap:8px}
.ucell{border:2px solid #333;padding:5px;line-height:0;cursor:pointer;background:#050505;animation:upop .35s ease-out backwards}
.eq .ucell canvas{width:40px;height:40px}
.ucell:active{transform:translate(1px,1px)}
@keyframes upop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;background:rgba(0,0,0,.88);padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box;text-align:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
/* centrado vertical que no corta el contenido si no cabe (se puede desplazar) */
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#ov>*{flex-shrink:0}
#ov .new{color:#5cff4a}
.ds div+div{margin-top:4px}
.ds .tw{color:#ffffff}
/* catálogo */
.cat-head{width:min(420px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px}
.cat-chips{width:min(420px,100%);display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;touch-action:pan-x}
.cat-chip{flex:none;border:2px solid #333;padding:4px;cursor:pointer;line-height:0}
.cat-chip.on{border-color:#fff}
.cat-chip canvas{width:24px;height:24px;image-rendering:pixelated}
.cat-grid{width:min(420px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cell{border:2px solid #222;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#050505}
.cell.on{border-color:#555}
.cell canvas{width:70%;height:70%;image-rendering:pixelated}
.cat-info{width:min(420px,100%);border:3px solid #333;padding:10px;text-align:left;box-sizing:border-box}
#ov.show{display:flex}
/* ficha del catálogo: ventana encima de todo, se cierra tocando */
#cpop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);padding:16px;box-sizing:border-box;z-index:5;touch-action:none}
#cpop.show{display:flex}
#cpop .box{width:min(360px,100%);max-height:80vh;overflow-y:auto;background:#000;border:3px solid #fff;padding:14px;text-align:left;box-sizing:border-box;touch-action:pan-y}
#cpop .box canvas{width:56px;height:56px;image-rendering:pixelated;display:block;margin-bottom:10px}
#cpop .t{text-align:center;margin-top:12px}
.logo{font-size:26px;line-height:1.3;color:#fff;text-shadow:3px 3px 0 #2b8a2b}
.t{font-size:8px;line-height:2;color:#8fa0a0}
.big{font-size:18px;line-height:1.6}
.btn{margin-top:16px;padding:14px 22px;border:3px solid #fff;font-size:12px;cursor:pointer}
.card{width:min(340px,92vw);border:3px solid #fff;padding:12px;display:flex;gap:12px;align-items:center;background:#000;text-align:left;box-sizing:border-box;cursor:pointer}
.card canvas{width:44px;height:44px;image-rendering:pixelated;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(340px,92vw)}
.tile{border:3px solid #fff;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;opacity:.6}
.tile canvas{width:40px;height:40px;image-rendering:pixelated}
.tile.on{opacity:1;outline:3px solid #fff;outline-offset:3px}
.pip{display:inline-block;width:6px;height:6px;margin:0 2px}
.tag{font-size:7px;color:#8fa0a0;margin-bottom:7px;line-height:1.6}
.nm{font-size:11px;line-height:1.5}
.ds{font-size:7px;color:#c8d0d0;margin-top:7px;line-height:1.8}
.btn:active,.card:active{transform:translate(2px,2px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sb"></div>
<div id="pz" role="button" aria-label="Pausa"><i></i><i></i></div>
<div id="ov"></div>

<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov'),probe=document.getElementById('sb');
let W,H,DPR,SB=0,ST=0,P=3,EP=2;
function resize(){
 // 2x basta para el pixel art y pinta la mitad de píxeles que 3x (más fluido en móvil)
 DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
 // márgenes de la pantalla: los pasa la app (Expo) o, en el navegador, los da el CSS
 const sf=window.__SAFE;
 if(sf){ST=sf.top||0;SB=sf.bottom||0;ov.style.paddingTop=(16+ST)+'px';ov.style.paddingBottom=(16+SB)+'px'}
 else{const cs=getComputedStyle(probe);SB=parseFloat(cs.paddingBottom)||0;ST=parseFloat(cs.paddingTop)||0}
 P=Math.max(2,Math.min(4,Math.floor(Math.min(W,560)/130)));EP=Math.max(2,P-1);
}
addEventListener('resize',resize);resize();

// ================= AJUSTES =================
// se guardan en el móvil: sonido, vibración y temblor de pantalla
let settings={sound:1,vib:1,shake:1};
try{Object.assign(settings,JSON.parse(localStorage.getItem('invasores_cfg')||'{}'))}catch(e){}
function saveSettings(){try{localStorage.setItem('invasores_cfg',JSON.stringify(settings))}catch(e){}}

// ================= SONIDO =================
// todos los sonidos se generan con código (Web Audio): no hay archivos de audio
const SFX={ctx:null,master:null,noise:null,last:{}};
function audioInit(){
 if(SFX.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const c=SFX.ctx=new AC();SFX.master=c.createGain();SFX.master.gain.value=.3;SFX.master.connect(c.destination);
 const n=c.createBuffer(1,c.sampleRate*.6,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;SFX.noise=n;
}
// el navegador solo deja sonar audio después de que toques la pantalla
addEventListener('pointerdown',()=>{audioInit();if(SFX.ctx&&SFX.ctx.state!=='running')SFX.ctx.resume()},true);
function tone(type,f1,f2,dur,vol,delay){
 const c=SFX.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(SFX.master);o.start(t);o.stop(t+dur+.02);
}
function noiseHit(dur,vol,freq,delay,q){
 const c=SFX.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
 s.buffer=SFX.noise;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.2),t+dur);f.Q.value=q||1;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(SFX.master);s.start(t);s.stop(t+dur+.02);
}
// cada sonido tiene un tiempo mínimo entre repeticiones para que la lluvia de disparos no sature
const SFX_CD={shoot:.075,hit:.045,kill:.035,ex:.07,zap:.08,eshot:.12,block:.06,frz:.1};
function sfx(name){
 if(!settings.sound||!SFX.ctx||SFX.ctx.state!=='running')return;
 const now=SFX.ctx.currentTime,cd=SFX_CD[name];if(cd&&now-(SFX.last[name]||0)<cd)return;SFX.last[name]=now;
 try{switch(name){
  case'shoot':tone('square',880+Math.random()*120,440,.05,.05);break;
  case'hit':noiseHit(.04,.08,3200);break;
  case'kill':tone('square',520,180,.08,.08);noiseHit(.06,.06,2200);break;
  case'ex':noiseHit(.28,.22,1400,0,.8);tone('sine',120,40,.25,.18);break;
  case'zap':tone('sawtooth',1400,300,.09,.05);tone('square',2200,900,.06,.03,.02);break;
  case'frz':tone('triangle',1800,2600,.12,.05);break;
  case'eshot':tone('triangle',320,180,.07,.04);break;
  case'block':tone('triangle',1300,1700,.06,.07);break;
  case'hurt':noiseHit(.35,.3,700,0,.6);tone('sawtooth',160,50,.35,.2);break;
  case'pick':tone('square',660,990,.06,.07);break;
  case'lvl':[523,659,784,1046].forEach((f,i)=>tone('square',f,0,.11,.08,i*.07));break;
  case'fuse':[392,523,659,784,1046,1318].forEach((f,i)=>tone('triangle',f,0,.16,.1,i*.06));noiseHit(.5,.08,6000,.1);break;
  case'rainbow':[1318,1568,1760,2093].forEach((f,i)=>tone('sine',f,0,.09,.05,i*.05));break;
  case'over':[392,330,262,196].forEach((f,i)=>tone('square',f,f*.98,.22,.09,i*.18));break;
  case'pause':tone('square',440,0,.05,.06);tone('square',330,0,.05,.06,.06);break;
 }}catch(e){}
}

// ================= VIBRACIÓN =================
// dentro de la app la hace el móvil (Expo Haptics); en el navegador, si se puede, navigator.vibrate
function haptic(k){
 if(!settings.vib)return;
 try{if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({t:'haptic',k}));else if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(k==='heavy'?60:k==='success'?[30,40,30]:20)}catch(e){}
}

function fid(a,b){return BASE.indexOf(a)<BASE.indexOf(b)?'f:'+a+'+'+b:'f:'+b+'+'+a}
function parts2(id){return id.slice(2).split('+')}
function isF(id){return id.startsWith('f:')}
function nameOf(id){return isF(id)?FN[id.slice(2)]:T[id].n}
function colorOf(id){return isF(id)?T[parts2(id)[0]].c:T[id].c}

const KEYS=['dmg','spd','pierce','bnc','ex','exm','ch','chr','fz','burn','bt','ign','pdps','pt','psp','fr','beam',
 'hom','ret','push','bl','hole','sweep','sweepR','pud','pudT','charm','charmT','guard','vamp','snake','tri','echo','exec','dis','met','sbite','hunt','vch'];
function blank(){const b={};for(const k of KEYS)b[k]=0;b.dmg=1;b.spd=620;return b}
function S(id,l,l2,fl,m){
 if(isF(id))return FS(id,l,l2,fl);
 if(m){const o=S(id,l);o.tw='m:'+id+':'+m;const H=TW[o.tw];if(H&&H.mod)H.mod(o);return o}
 const b=blank();
 switch(id){
  case'laser':b.dmg=1+.5*(l-1);b.spd=700+60*l;break;
  case'fire':b.dmg=.8;b.burn=.7+.35*(l-1);b.bt=2.5;b.ign=l-1;break;
  case'ice':b.dmg=.7;b.fz=1+.75*l;break;
  case'poison':b.dmg=.5;b.pdps=.25*l;b.pt=4;b.psp=l>=3?2:1;break;
  case'boom':b.dmg=1;b.ex=P*(6+3*l);b.exm=.45+.15*l;break;
  case'zap':b.dmg=.9;b.ch=1+l;b.chr=P*(20+3*l);break;
  case'bounce':b.dmg=.9;b.bnc=1+l;break;
  case'pierce':b.dmg=1;b.pierce=1+l;b.spd=820;break;
  case'split':b.dmg=1;b.fr=1+l;break;
  case'homing':b.dmg=.9;b.hom=3+2*l;b.hunt=l;break;
  case'boomer':b.dmg=.8+.15*l;b.ret=l;b.spd=560;break;
  case'wind':b.dmg=.8;b.push=P*(4+3*l);break;
  case'bleed':b.dmg=.7;b.bl=.1+.05*l;break;
  case'hole':b.dmg=.6;b.hole=.4+.3*l;break;
  case'sweep':b.dmg=.9;b.sweep=.45+.15*l;b.sweepR=[0,P*30,P*55,1e9][l];break;
  case'puddle':b.dmg=.7;b.pud=.4+.3*l;b.pudT=2.5+l;break;
  case'charm':b.dmg=.8;b.charm=.08+.06*l;b.charmT=3+l;break;
  case'guard':b.dmg=.9;b.guard=1+l;break;
  case'vamp':b.dmg=.9;b.vamp=1+.4*(l-1);break;
  case'snake':b.dmg=1;b.snake=P*(7+3*l);b.sbite=l;break;
  case'tri':b.dmg=1;b.tri=.55+.15*l;break;
  case'echo':b.dmg=.9;b.echo=.4+.2*l;break;
  case'exec':b.dmg=.9;b.exec=.1+.06*l;b.vch=l;break;
  case'dis':b.dmg=.7;b.dis=.05+.03*l;break;
  case'meteor':b.dmg=.8;b.met=.6+.25*l;break;
 }
 return b;
}
// nivel de fusión (1-3): cada nivel refuerza más la fusión
const FLV={dmg:[0,1.5,1.75,2],mag:[0,1.25,1.4,1.55],cnt:[0,1,1,2]};
function FS(id,la,lb,fl){
 fl=fl||1;
 const [a,bb]=parts2(id),A=S(a,la||3),B=S(bb,lb||3),o=blank();
 for(const k of KEYS)o[k]=Math.max(A[k],B[k]);
 o.dmg=Math.max(A.dmg,B.dmg)*FLV.dmg[fl];
 // refuerzo general de la fusión
 for(const k of ['pierce','bnc','ch','fr','ign','psp','guard','sbite','hunt','vch'])if(o[k])o[k]+=FLV.cnt[fl];
 for(const k of ['ex','fz','burn','pdps','chr','hom','push','bl','hole','pud','pudT','charmT','vamp','dis','met'])o[k]*=FLV.mag[fl];
 o.sweep=Math.min(.95,o.sweep*1.2);o.charm=Math.min(.5,o.charm*1.25);o.exec=Math.min(.4,o.exec*1.25);o.echo=Math.min(1,o.echo*1.2);if(o.tri)o.tri=Math.min(1,o.tri*1.1);
 if(o.ex)o.exm=Math.max(o.exm,.65);
 // efecto especial de la fusión (ver TW)
 o.tw=a+'+'+bb;const H=TW[o.tw];if(H&&H.mod)H.mod(o,fl);
 return o;
}

 'poison+puddle':{d:'Ciénaga: el charco da 1 carga cada medio segundo y deja acumular hasta 12 cargas.',mod(o){o.pdo=(b)=>({tk:e=>{e.cap12=1;charge(e,1,b.pdps)}})}},
 'poison+charm':{d:'Filtro de amor: los aliens con 4 cargas o más se encantan seguro al golpearlos.',hit(b,e){if(!e.dead&&(e.ps||0)>=4)charmE(e,b.charmT)}},

 'boom+bleed':{d:'Esquirla: la explosión deja 2 heridas a cada alien que alcanza.',hit(b,e){foesNear(e.x,e.y,b.ex+EH()).forEach(o=>wound(o,1,b.bl))}},

 'boom+puddle':{d:'Mina: en vez de charco deja una mina que explota cuando un alien la pisa (máximo 4 minas).',

 'boom+vamp':{d:'Sangría: las muertes por explosión cuentan doble para recuperar vida.',vamp(e){return e.exk?2:1}},

 'boom+tri':{d:'Salva: la bala central explota con el doble de radio.',fire(mk,x,y,mul,st){volley(mk,x,mul*st.tri,[-.22,0,.22],(nb,i)=>{if(i===1)nb.ex*=2});return true}},

 'boom+dis':{d:'Implosión: la explosión atrae hacia el centro a los aliens de alrededor.',hit(b,e){foesNear(e.x,e.y,b.ex*2).forEach(o=>o.dx=(o.dx||0)+(e.x-o.x)*.6)}},

  tick(b,dt){b.av=(b.av||0)-dt;if(b.av>0)return;b.av=.2;arcs.push({x1:px,y1:py,x2:b.x,y2:b.y,t:.15,T:.15,c:'#fff200'});
   for(const o of en){if(!foe(o))continue;const vx=b.x-px,vy=b.y-py,L=vx*vx+vy*vy||1,t=Math.max(0,Math.min(1,((o.x-px)*vx+(o.y-py)*vy)/L));if(Math.hypot(px+vx*t-o.x,py+vy*t-o.y)<EH()+P*2)dmgE(o,b.dmg*.3)}}},

 'zap+hole':{d:'Bobina: el remolino lanza un rayo cada medio segundo al alien más cercano.',

 'zap+sweep':{d:'Red eléctrica: un rayo une a todos los aliens de la fila y les hace el 50% más.',hit(b,e){let a=e;for(const o of rowOf(e).sort((p,q)=>p.x-q.x)){zapTo(a,o,b.dmg*.5);a=o}}},
 'zap+puddle':{d:'Charco eléctrico: cada segundo el charco lanza un rayo al alien más cercano.',
  mod(o){o.pdo=(b)=>({c:'#fff200',zap:p=>{const t=nearest(p.x,p.y,()=>true,TWO()*3);if(t)zapTo(p,t,b.dmg*.6)}})}},
 'zap+charm':{d:'Flechazo: si hay un alien encantado, cada impacto lanza también una cadena de rayo desde él.',hit(b){const c=en.find(o=>o.charm>0&&!o.dead);if(c&&!b.frag){lastChain=[];chain(c,b)}}},
 'zap+guard':{d:'Pararrayos: cada bala enemiga destruida lanza una cadena de rayo.',guard(b,q){const t=nearest(q.x,q.y,()=>true,b.chr*2);if(t){arcs.push({x1:q.x,y1:q.y,x2:t.x,y2:t.y,t:.2,T:.2,c:'#fff200'});dmgE(t,b.dmg*.8);chain(t,b)}}},

 'zap+echo':{d:'Réplica: el eco repite la cadena con el doble de saltos.',echoMod(nb){nb.ch*=2}},
 'zap+exec':{d:'Silla eléctrica: si un salto mata a un alien, el rayo salta una vez más desde él.',hit(b){const d=lastChain.find(o=>o.dead);if(d){const L=lastChain;chain(d,Object.assign({},b,{ch:1}));lastChain=L}}},
 'zap+dis':{d:'Sobrecarga: cada salto del rayo quita además la mitad del % de vida máxima.',hit(b){for(const o of lastChain)if(!o.dead)dmgE(o,o.max*b.dis*.5)}},
 'zap+meteor':{d:'Relámpago: el meteorito cae como un rayo que daña a toda la columna y luego salta en cadena.',

 'bounce+pierce':{d:'Pinball: cada choque, con aliens o con los bordes, le suma un 10% de daño.',hit(b){b.dmg*=1.1},tick(b){const w=b.x<=4||b.x>=W-4;if(w&&!b.onW)b.dmg*=1.1;b.onW=w}},
 'bounce+split':{d:'Metralla: en cada rebote suelta 2 trozos.',hit(b,e){if(b.bnc>0&&!b.frag)frags(Object.assign({},b,{fr:2}),e,e.x,e.y)}},
 'bounce+homing':{d:'Cada rebote va a por el alien más bajo y tiene 2 rebotes extra.',mod(o){o.bnc+=2;o.lowFirst=1}},
 'bounce+boomer':{d:'Yoyó: rebota entre aliens y, cuando acaba, vuelve a ti golpeando otra vez.'},
 'bounce+wind':{d:'Balón: cada rebote sube un poco al alien que golpea.',hit(b,e){if(!e.dead)pushUp(e,P*8)}},

 'bounce+sweep':{d:'Carambola: el último rebote barre la fila entera al 100%.',hit(b,e){if(b.bnc<=0)sweepRow(Object.assign({},b,{sweep:1,sweepR:1e9}),e)}},

 'sweep+tri':{d:'Rastrillada: el barrido hace un 15% más por cada alien que haya en la fila.',pre(b,e){b.sweep0=b.sweep0||b.sweep;b.sweep=b.sweep0*(1+.15*rowOf(e).length)}},

 'sweep+dis':{d:'Borrador: el barrido también quita la mitad del % de vida máxima.',hit(b,e){rowOf(e).forEach(o=>dmgE(o,o.max*b.dis*.5))}},
 'sweep+meteor':{d:'Aguacero: cae un meteorito pequeño sobre cada alien de la fila (40% del daño).',hit(b,e){if(!b.frag)rowOf(e).slice(0,6).forEach(o=>meteorOn(o,b.dmg*.4,{t:rnd(.2,.5)}))}},

 // ---------- SERPIENTE ----------
 'snake+tri':{d:'Medusa: tres serpientes; si dos están juntas al golpear, hacen el doble de daño.',
  fire(mk,x,y,mul,st){volley(mk,x,mul*st.tri,[-.16,0,.16]);return true},dmg(b,e){if(!b.grp)return 1;return bullets.some(o=>o!==b&&o.grp===b.grp&&!o.dead&&Math.hypot(o.x-b.x,o.y-b.y)<P*8)?2:1}},
 'snake+echo':{d:'Cascabel: en vez de eco, sale una nueva serpiente con todo el daño desde el alien golpeado hacia arriba (y esa puede soltar otra).',
  mod(o){o.noEcho=1},hit(b,e){if(b.frag||b.cs||(b.cg||0)>=2)return;b.cs=1;echoes.push({t:.3,fn:()=>bullets.push(child(b,{x:e.x,y:e.y-EH(),vx:0,vy:-600,dmg:b.dmg,snake:b.snake,sbite:b.sbite,frag:0,isEcho:1,cg:(b.cg||0)+1,hit:new Set([e]),r:b.r}))})}},
 'snake+exec':{d:'Mamba: remata a los aliens con poca vida que tenga al lado al serpentear, aunque no los toque.',tick(b){graze(b,P*8,o=>{if(o.hp<o.max*b.exec)execE(o)})}},
 'snake+dis':{d:'Ciempiés: sale como 4 segmentos seguidos; cada segmento golpea y desintegra (40% del daño).',
  fire(mk,x,y,mul){const ph=Math.random()*6.283;for(let k=0;k<4;k++){const nb=mk(x,mul*.4,0);nb.y+=k*P*5;nb.ph=ph-k*.5;bullets.push(nb)}return true}},
 'snake+meteor':{d:'Dragón celeste: el meteorito cae serpenteando y golpea también a los aliens de alrededor (50%).',met(m){m.fn=mm=>foesNear(mm.x,mm.y,P*22).forEach(o=>dmgE(o,mm.dmg*.5))}},
 // ---------- TRIPLE ----------
 'tri+echo':{d:'Sexteto: 0,3 s después repite las tres balas desde donde estés.',
  mod(o){o.noEcho=1},fire(mk,x,y,mul,st){volley(mk,x,mul*st.tri,[-.22,0,.22]);echoes.push({t:.3,fn:()=>{const nb=[-.22,0,.22].map(a=>{const b2=mk(px,mul*st.tri*st.echo,a);b2.x=b2.cx=px;b2.y=py-P*5;b2.vol=null;return b2});bullets.push(...nb)}});return true}},
 'tri+exec':{d:'Tribunal: si dos balas del trío dan al mismo alien y le queda menos de la mitad de vida, lo remata.',

 'tri+dis':{d:'Trisector: el alien que recibe las tres balas pierde el triple de % de vida.',
  fire(mk,x,y,mul,st){volley(mk,x,mul*st.tri,[-.12,0,.12]);return true},hit(b,e){if(grpHit(b,e)===3&&!e.dead)dmgE(e,e.max*b.dis*2)}},
 'tri+meteor':{d:'Tres estrellas: el meteorito cae tres veces seguidas en la misma columna.',met(m){m.twice=1;m.fn=mm=>{if(!mm.three){mm.three=1;meteorOn(topOfCol(mm.e.col),mm.dmg,{t:.6})}}}},
 // ---------- ECO ----------
 'echo+exec':{d:'Sentencia: si al llegar el eco el alien tiene menos de la mitad de vida, lo remata.',thr(b){return b.isEcho?.5:0}},
 'echo+dis':{d:'Resonancia: el eco quita el doble de % de vida.',echoMod(nb){nb.dis*=2}},
 'echo+meteor':{d:'Tormenta de ecos: el eco llama un segundo meteorito.',hit(b,e){if(b.isEcho)meteorOn(topOfCol(e.col),b.dmg*b.met,{t:.2})}},
 // ---------- EJECUCIÓN / DESINTEGRADOR ----------
 'exec+dis':{d:'Juicio final: remata a cualquier alien por debajo del 35% de vida.',thr(){return .35}},
 'exec+meteor':{d:'Apocalipsis: el meteorito remata a todo lo que alcanza por debajo del umbral.',met(m,b){m.fn=mm=>foesNear(mm.x,mm.y,P*16).forEach(o=>{if(o.hp<o.max*b.exec)execE(o)})}},
 'dis+meteor':{d:'Asteroide: el meteorito quita un 25% de vida máxima a todo lo que alcanza.',met(m){m.fn=mm=>foesNear(mm.x,mm.y,P*18).forEach(o=>dmgE(o,o.max*.25))}},

// ================= MAESTRÍAS =================
// Cuando todos tus huecos están llenos y solo te queda un disparo sin fusionar, el alien arcoíris te deja
// elegir una de sus dos maestrías: cambian cómo funciona el disparo. Cada una es un objeto con los mismos
// ganchos que las fusiones (TW) y se registra como TW['m:<disparo>:<A|B>'].
function hasM(id,k){return slots.some(s=>s.id===id&&s.m===k)}
function mLv(id){const s=slots.find(s=>s.id===id);return s?s.l:1}
const weak=e=>e.ps>0&&hasM('poison','A');
function bloodThirst(){if(hasM('bleed','B')){sed=Math.min(15,sed+1);sedT=3}}
let tracers=[];function tracer(x1,y1,x2,y2,c){tracers.push({x1,y1,x2,y2,t:.15,T:.15,c})}
const MAS={
 laser:{
  A:{n:'Prisma',d:'Al tocar al primer alien, el láser se abre en 3 rayos instantáneos hacia los aliens más cercanos (70% del daño).',
   hit(b,e){if(b.frag||b.prz)return;b.prz=1;foesNear(e.x,e.y,TWO()*6,e).sort((p,q)=>Math.hypot(p.x-e.x,p.y-e.y)-Math.hypot(q.x-e.x,q.y-e.y)).slice(0,3).forEach(o=>{tracer(e.x,e.y,o.x,o.y,'#dfefff');hit(Object.assign({},b,{frag:1,prz:1,dmg:b.dmg*.7,hit:new Set()}),o)})}},
  B:{n:'Francotirador',d:'Cada disparo va recto e instantáneo al alien más bajo, el más peligroso.',
   fire(mk,x,y,mul){const t=lowest();if(!t)return false;const b=mk(x,mul,0);tracer(x,y,t.x,t.y,'#ffffff');flash(t.x,t.y,'#ffffff',P*10,.1);b.hit.add(t);volHit(b);hit(b,t);return true}}},
 fire:{
  A:{n:'Corona solar',d:'Un sol flota sobre tu nave y quema a todos los aliens que bajan de la mitad de la pantalla.'},
  B:{n:'Soplete',d:'En vez de bala, un cono de fuego continuo delante de tu nave que llega a media pantalla (55% del daño a cada alien).',
   fire(mk,x,y,mul){const R2=P*110;for(const o of en){if(!foe(o))continue;const dx=o.x-x,dy=y-o.y;if(dy<-EH()||dy>R2||Math.abs(dx)>dy*.5+EH())continue;const b=mk(x,mul*.55,0);b.hit.add(o);hit(b,o)}
    for(let k=0;k<14;k++){const a=-Math.PI/2+rnd(-.42,.42),v=rnd(260,420);addP(x,y,Math.cos(a)*v,Math.sin(a)*v,rnd(.15,.25),Math.random()<.5?'#ff8a1f':'#ffe14d',rnd(8,14),0,.93)}return true}}},
 ice:{
  A:{n:'Glaciación',d:'Un alien congelado 3 veces se vuelve un bloque de hielo: no baja, para balas enemigas y tapa a los de arriba. Al romperlo estalla en esquirlas.',
   hit(b,e){if(e.boss||e.rock||e.dead||e.block)return;e.gc=(e.gc||0)+1;if(e.gc>=3){e.block=1;e.fz=1e9;e.hp=Math.max(e.hp,e.max);sparks(e.x,e.y,'#ffffff',14,160,7);sfx('frz')}}},
  B:{n:'Hielo fino',d:'Los aliens congelados que llegan abajo se rompen sin quitarte vida.'}},
 poison:{
  A:{n:'Debilitante',d:'Los envenenados sufren el doble de quemadura, congelación y heridas.'},
  B:{n:'Toxina mortal',d:'El veneno ya no hace daño poco a poco: al llegar a 6 cargas el alien muere al instante (a un jefe le quita un 25%).'}},
 boom:{
  A:{n:'Lapa',d:'Las bombas se pegan al alien y explotan todas a la vez cada 3 s (más bombas, más grande).',
   mod(o){o.noEx=1},hit(b,e){if(b.frag||e.dead)return;e.lap=e.lap||{n:0,d:0,r:0};e.lap.n++;e.lap.d=Math.max(e.lap.d,b.dmg*(b.exm||.6));e.lap.r=Math.max(e.lap.r,b.ex)}},
  B:{n:'Reacción en cadena',d:'Los aliens que mueren por una explosión explotan también.'}},
 zap:{
  A:{n:'Estática',d:'Los aliens tocados quedan cargados 4 s; cada segundo salta un arco entre cada dos cargados que estén cerca.',
   hit(b,e){for(const o of [e,...lastChain])if(foe(o))o.stat=4}},
  B:{n:'Jaula eléctrica',d:'Los aliens tocados quedan unidos 3 s: lo que golpea a uno daña al 50% a todos los unidos.',
   hit(b,e){const g={};for(const o of [e,...lastChain])if(foe(o)){o.cage=g;o.cageT=3}}}},
 bounce:{
  A:{n:'Rebote eterno',d:'La bala no muere: rebota por paredes y aliens durante 6 s (máximo 3 a la vez).',
   mod(o){o.bnc=999},fire(){return bullets.filter(b=>b.eter&&!b.dead).length>=3},
   tick(b,dt){if(b.frag)return;b.eter=1;b.life=(b.life||0)+dt;b.bnc=999;if(b.y<ST+P*6&&b.vy<0)b.vy=Math.abs(b.vy);if(b.y>lineY()-P*2&&b.vy>0)b.vy=-Math.abs(b.vy);if(b.life>6)b.dead=1}},
  B:{n:'Billar',d:'El alien golpeado sale despedido como una bola y daña al 60% a los que choca.',
   hit(b,e){if(e.dead||e.boss)return;const a=Math.atan2(b.vy,b.vx);e.dx=(e.dx||0)+Math.cos(a)*P*14;pushUp(e,P*6,1);
    for(const o of foesNear(e.x+Math.cos(a)*P*10,e.y,EH()*2.6,e)){dmgE(o,b.dmg*.6);o.dx=(o.dx||0)+Math.cos(a)*P*6;sparks((e.x+o.x)/2,(e.y+o.y)/2,b.c,6,120,6)}}}},
 pierce:{
  A:{n:'Lanza horizontal',d:'La bala cruza la pantalla de lado a lado a la altura del alien más bajo, atravesándolo todo.',
   fire(mk,x,y,mul){const t=lowest();if(!t)return false;TM.ls=-(TM.ls||1);const sx=TM.ls>0?6:W-6,b=mk(sx,mul,0);b.x=b.cx=sx;b.y=t.y;b.vx=TM.ls>0?900:-900;b.vy=0;b.pierce=99;b.lance=1;bullets.push(b);return true},
   tick(b,dt){if(!b.lance)return;b.la=(b.la||0)+dt;if(b.la>.12&&(b.cx<=4||b.cx>=W-4))b.dead=1}},
  B:{n:'Barrena',d:'Se queda girando 1 s dentro del primer alien, dañándolo sin parar, y luego sigue.',
   hit(b,e){if(b.frag||b.drill||e.dead)return;b.drill={e,t:1,vx:b.vx,vy:b.vy,k:0};b.vx=0;b.vy=0;b.pierce=Math.max(b.pierce,1)},
   tick(b,dt){const d=b.drill;if(!d||d.done)return;d.t-=dt;d.k-=dt;if(!d.e.dead){b.x=b.cx=d.e.x;b.y=d.e.y}
    if(d.k<=0){d.k=.1;if(!d.e.dead){dmgE(d.e,b.dmg*.3);sparks(b.x,b.y,b.c,3,90,5)}}if(d.t<=0||d.e.dead){d.done=1;b.vx=d.vx;b.vy=d.vy}}}},
 split:{
  A:{n:'Acumulador',d:'No se parte al impactar: cada 5 impactos suelta de golpe una explosión de 20 trozos.',
   mod(o){o.fr=0},hit(b,e){if(b.frag)return;TM.acc=(TM.acc||0)+1;if(TM.acc>=5){TM.acc=0;flash(e.x,e.y,'#ffffff',P*18,.2);frags(Object.assign({},b,{fr:20,dmg:b.dmg*1.2}),e,e.x,e.y)}}},
  B:{n:'Anillo de metralla',d:'Los trozos giran 4 s alrededor de tu nave, dañando lo que tocan y parando balas.',
   frag(f){f.ring={t:4,a:Math.random()*6.283};f.pierce=99;f.guard=99;f.vx=0;f.vy=0},
   tick(b,dt){if(!b.ring)return;const r=b.ring;r.t-=dt;r.a+=dt*3.5;const tx2=px+Math.cos(r.a)*P*16,ty2=py-P*4+Math.sin(r.a)*P*10;b.cx+=(tx2-b.cx)*Math.min(1,dt*8);b.x=b.cx;b.y+=(ty2-b.y)*Math.min(1,dt*8);if(Math.random()<dt*2)b.hit=new Set();if(r.t<=0)b.dead=1}}},
 homing:{
  A:{n:'Patrulla',d:'Las balas que fallan no desaparecen: dan vueltas por la pantalla hasta encontrar un alien (5 s).',
   tick(b,dt){if(b.frag)return;b.patrol=1;b.pl=(b.pl||0)+dt;if(b.y<ST+P*8&&b.vy<0)b.vy=Math.abs(b.vy);if(b.y>lineY()-P*4&&b.vy>0)b.vy=-Math.abs(b.vy);if(b.pl>5)b.dead=1}},
  B:{n:'Marca de caza',d:'Marca al alien con más vida: todas tus balas, de cualquier tipo, se curvan hacia él hasta que muere.'}},
 boomer:{
  A:{n:'Molinete',d:'No vuelve: gira 5 s alrededor de tu nave en un círculo amplio, cortando todo.',

function fuseRows(a,b){
 // los dos proyectiles superpuestos y centrados: lo que es solo de uno lleva su color, lo que comparten se mezcla
 const A=SPR[a],B=SPR[b],w=Math.max(A[0].length,B[0].length),h=Math.max(A.length,B.length);
 const grid=Rw=>{const ox=Math.floor((w-Rw[0].length)/2),oy=Math.floor((h-Rw.length)/2),g=[];for(let r=0;r<h;r++){const row=[];for(let c=0;c<w;c++){const rr=r-oy,cc=c-ox;row.push(rr>=0&&rr<Rw.length&&cc>=0&&cc<Rw[0].length?Rw[rr][cc]:'.')}g.push(row)}return g};
 const ga=grid(A),gb=grid(B);
 return ga.map((row,r)=>row.map((ca,c)=>{const cb=gb[r][c];if(ca!=='.'&&cb!=='.')return (ca==='2'||cb==='2')?'W':'m';if(ca!=='.')return ca==='2'?'A':'a';if(cb!=='.')return cb==='2'?'B':'b';return '.'}).join(''));

function fusePairs(){

 for(let i=0;i<slots.length;i++)for(let j=i+1;j<slots.length;j++){
  const A=slots[i],B=slots[j];if(isF(A.id)||isF(B.id))continue;
  if(!have.has(fid(A.id,B.id)))out.push([i,j]);
 }
 return out;
}

 for(const [src,n] of Object.entries(run.kills)){

  const ids=isF(src)?parts2(src):[src];for(const id of ids)st.k[id]=(st.k[id]||0)+n;
 }
 st.kills+=kills;st.fus+=run.fus;st.blocks+=run.blocks;st.maxLv=Math.max(st.maxLv,lv);
 const usedE=x=>[...run.used].some(id=>id===x)||slots.some(s=>s.id===x||(isF(s.id)&&parts2(s.id).includes(x)));
 if(usedE('fire')&&usedE('poison'))st.fp=1;
 if(won&&mode==='sector'){if(!run.lost)st.perfect++;const sk=Object.keys(SHIPS).find(k=>SHIPS[k]===ship),ss=prof.ss[sk]=prof.ss[sk]||[0,0,0,0,0,0];ss[sect]=Math.max(ss[sect],diffL)}
 const got=[];
 for(const a of ACH){if(prof.ach.includes(a.id))continue;const [c,g]=a.g(st);if(c>=g){prof.ach.push(a.id);got.push(a);
  for(const x of a.r.shots||[])if(!prof.shots.includes(x))prof.shots.push(x);

 saveProf();return got;

function foesNear(x,y,r,ex){return en.filter(o=>foe(o)&&o!==ex&&Math.hypot(o.x-x,o.y-y)<r)}
function rowOf(e,f){return en.filter(o=>foe(o)&&o!==e&&Math.abs(o.y-e.y)<EH()*1.3&&(!f||f(o)))}
function colOf(x,f){return en.filter(o=>foe(o)&&Math.abs(o.x-x)<EH()+P*2&&(!f||f(o)))}
function topOfCol(col){let t=null;for(const o of en)if(foe(o)&&o.col===col&&(!t||o.y<t.y))t=o;return t}
function lowest(){let t=null;for(const o of en)if(foe(o)&&(!t||o.y>t.y))t=o;return t}
function pick(f){let t=null,bv=-1e9;for(const o of en){if(!foe(o))continue;const v=f(o);if(v>bv){bv=v;t=o}}return t}
function densest(){return pick(o=>foesNear(o.x,o.y,TWO()*1.6).length)}
function wound(e,n,k){if(!foe(e))return;bloodThirst();e.bls=Math.min(10,(e.bls||0)+n*(weak(e)?2:1));e.blk=Math.max(e.blk||0,k||.15)}
function charge(e,n,dps){if(foe(e)&&n>0)applyStatus(e,{pdps:dps||.4,pt:4,psp:1},n)}
function frz(e,t){if(foe(e)){if(e.fz<=0)sparks(e.x,e.y,'#bff8ff',5,90,6);e.fz=Math.max(e.fz,e.boss?Math.min(t,.6):t)}}

function sweepRow(b,e){

 e.ltw=b.tw;e.lvamp=b.vamp||0;e.nh=(e.nh||0)+1;

 applyStatus(e,b);

 if(thr&&!e.dead&&!(e.charm>0)&&e.hp<e.max*thr){execE(e);if(H&&H.execd)H.execd(b,e);

 // Ráfaga: el viento empuja también a los dos de al lado en la fila, con la mitad de fuerza

 if(b.met&&!b.frag&&!b.noMet){const tg=topOfCol(e.col);if(tg){const m={e:tg,x:tg.x,y:tg.y,t:.28,T:.28,dmg:b.dmg*b.met,b:{fz:b.fz,burn:b.burn,bt:b.bt,pdps:b.pdps,pt:b.pt,psp:b.psp,bl:b.bl,c:'#ff5a00'}};m.src=curSrc;if(H&&H.met)H.met(m,b,e);m.x=m.e.x;m.y=m.e.y;meteors.push(m)}}

function mkBullet(id,l,x,y,mul,ang,l2,fl,mas){
 const st=S(id,l,l2,fl,mas);
 st.c=colorOf(id);st.c2=isF(id)?T[parts2(id)[1]].c:T[id].c2;
 const m=dmgMods(mul);st.dmg*=m.mul;if(m.crit)st.crit=1;
 st.r=P*1.5+P*alv('calibre');
 const a=ang||0;
 const b=Object.assign(st,{id,x,y,cx:x,ph:Math.random()*6.283,vx:Math.sin(a)*st.spd,vy:-Math.cos(a)*st.spd,hit:new Set(),main:1,roof:0,rp:0,pierce0:st.pierce});
 // la racha se cuenta por disparo (todas las balas que salen juntas), no por bala
 if(curVol){b.vol=curVol;curVol.left++}
 return b;
}
// cristal, racha y crítico: se aplican igual a balas y al haz
function dmgMods(mul){
 let m=mul*(alv('cristal')?2:1),crit=0;
 if(forceCrit){forceCrit=0;m*=2;crit=1}
 const rl=alv('racha');if(rl)m*=1+Math.min(streak,25)*[0,.02,.03,.04][rl];
 const cl=alv('critico');if(cl&&Math.random()<[0,.12,.2,.28][cl]){m*=2;crit=1}
 // Acorralado: +1% por alien en pantalla, con tope
 const acl=alv('acorralado');if(acl)m*=1+Math.min([0,.4,.6,.8][acl],.01*en.length);
 // Cañón de carga: el disparo cargado hace triple daño
 if(cargaBig)m*=3;
 return{mul:m,crit};
}
let cargaBig=0;
function volHit(b){if(b.vol&&!b.vol.hit){b.vol.hit=1;streak++;run.maxStreak=Math.max(run.maxStreak,streak)}}
function volMiss(b){if(b.vol&&!b.vol.hit&&!b.missed){b.missed=1;if(--b.vol.left<=0)streak=0}}
function beamAt(x,dmg,st){
 beams.push({x,t:.18,T:.18,c:'#fff200'});
 let low=null;
 for(const e of en){if(foe(e)&&Math.abs(e.x-x)<EH()+P*2){dmgE(e,dmg);if(!low||e.y>low.y)low=e}}
 const from=low&&!low.dead?low:nearest(x,py,()=>true,9999);
 if(from)chain(from,Object.assign({},st,{dmg}));
 return !!low;
}
function shoot(sl,x,y,mul){

 const H=TW[st0.tw];
 const mk=(x2,m,a)=>mkBullet(sl.id,sl.l,x2,y,m,a,sl.l2,sl.fl,sl.m);
 // algunas fusiones disparan a su manera (escopeta, abanico, tridentes...)
 if(H&&H.fire&&H.fire(mk,x,y,mul,st0))return;
 if(st0.beam){
  const m=dmgMods(mul),hitAny=beamAt(x,st0.dmg*m.mul,st0);
  if(m.crit&&alv('critico')>=3)explode(x,py-P*30,P*9,st0.dmg*m.mul*.5,{c:'#ffffff'},null);
  if(curVol&&hitAny)volHit({vol:curVol});
  return;
 }
 const angs=st0.tri?[-.22,0,.22]:[0],tm2=st0.tri?st0.tri:1;
 const dl=alv('doble');
 for(const a of angs){
  if(dl){const m=[0,.65,.75,.9][dl];bullets.push(mk(x-P*3,mul*m*tm2,a),mk(x+P*3,mul*m*tm2,a))}
  else bullets.push(mk(x,mul*tm2,a));

// trayectoria: teledirigido y vuelta del bumerán
function steer(b,sdt){
 const sp=Math.hypot(b.vx,b.vy)||1;
 if(markT&&!markT.dead&&!b.hom&&!b.frag&&!b.ally&&!b.rp&&sp>0){const cur=Math.atan2(b.vy,b.vx),want=Math.atan2(markT.y-b.y,markT.x-b.x);let d=want-cur;while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;const na=cur+Math.max(-2.5*sdt,Math.min(2.5*sdt,d));b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp}
 if(b.rp===2){const a=Math.atan2(py-b.y,px-b.x),s=Math.max(sp,620);b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;return}
 if(!b.hom||(b.frag&&!b.fh))return;
 let t=b.tg;
 if(!t||t.dead||t.charm>0||b.hit.has(t)){t=nearest(b.x,b.y,x=>!b.hit.has(x)&&(b.rp===1||b.patrol||x.y<b.y+P*4));b.tg=t}
 if(!t){if(b.rp===1)b.rp=2;return}
 const cur=Math.atan2(b.vy,b.vx),want=Math.atan2(t.y-b.y,t.x-b.x);let d=want-cur;
 while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;
 const turn=b.hom*sdt,na=cur+Math.max(-turn,Math.min(turn,d));
 b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
}
function turnBack(b){
 b.rp=b.hom?1:2;b.hit=new Set();b.pierce=b.pierce0||0;b.snakeOff=1;b.cx=b.x;b.tg=null;
 if(b.rp===2){const a=Math.atan2(py-b.y,px-b.x),s=Math.hypot(b.vx,b.vy);b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s}
 sparks(b.x,b.y,b.c,5,90,6);
 const H=TW[b.tw];if(H&&H.turn)H.turn(b);
}
// la bala se ha quedado sin rebotes ni perforación
function spent(b){

const fN=n=>String(Math.round(n*100)/100).replace('.',',');
const fN1=n=>String(Math.round(n*10)/10).replace('.',',');
const pc=n=>Math.round(n*100)+'%';
const AL=px=>fN1(px/(EP*14)); // tamaños medidos en anchos de alien
function describe(b){

 if(b.beam)L.push('Haz a toda la columna');
 if(b.tri)L.push('3 balas al '+pc(b.tri));

 if(b.burn)L.push('Quema '+fN(b.burn)+'/s '+fN(b.bt)+' s');
 if(b.ign)L.push('Prende a '+b.ign+' cercano'+(b.ign>1?'s':''));
 if(b.fz)L.push('Congela '+fN(b.fz)+' s');
 if(b.pdps)L.push('Veneno '+fN(b.pdps)+'/s por carga, 4 s');
 if(b.psp)L.push('Al morir contagia a '+b.psp);
 if(b.bl)L.push('Herida: +'+fN(b.bl)+' a cada golpe y +'+pc(b.bl*.32)+' al resto del daño');
 if(b.push)L.push('Empuja '+fN1(b.push/ESP())+' filas arriba; a los de al lado, la mitad');
 if(b.hole)L.push('Remolino '+fN(1+b.hole*.5)+' s, '+fN(b.hole*Math.max(1,b.dmg*.7))+'/s');

 if(b.vch)L.push('Tras rematar salta a '+b.vch+' más');
 if(b.dis)L.push('Quita +'+pc(b.dis)+' de vida máx.; su polvo, la mitad');
 if(b.met)L.push('Meteorito al '+pc(b.met));
 return L;
}

function options(){

 if(slots.length<shotSlots)BASE.filter(id=>prof.shots.includes(id)&&!slots.find(x=>x.id===id)).forEach(id=>shotP.push({k:'new',id}));
 slots.forEach(x=>{
  if(isF(x.id)){
   // subir una fusión es más raro que el resto: cada fusión sale en un ~4% de las subidas
   // (una mejora normal concreta sale en un ~5%)
   if((x.fl||1)<3&&Math.random()<FUSE_LV_CHANCE*(1+alv('fusionista')))fusP.push({k:'flv',id:x.id,l:(x.fl||1)+1});
  }else if(x.l<3)shotP.push({k:'lv',id:x.id,l:x.l+1});
 });
 if(fusP.length)out.push(fusP[0]);
 if(arts.length<artSlots)for(const id in ART){if(alv(id)||!prof.arts.includes(id))continue;if(id==='segunda'&&segUsed)continue;const A=ART[id];if(A.req&&!A.req())continue;artP.push({k:'art',id})}
 arts.forEach(a=>{if(a.l<ART[a.id].m)artP.push({k:'alv',id:a.id,l:a.l+1})});
 shuffle(shotP);shuffle(artP);
 if(shotP.length&&!out.length)out.push(shotP.pop());
 if(artP.length)out.push(artP.pop());
 const rest=shuffle([...shotP,...artP]);
 if(lives<5&&!alv('cristal'))rest.push({k:'life'});shuffle(rest);
 while(out.length<n&&rest.length)out.push(rest.pop());
 const fill=[{k:'xp'}];if(!alv('cristal')&&lives<5&&!out.some(o=>o.k==='life'))fill.push({k:'life'}); while(out.length<n&&fill.length)out.push(fill.shift());
 return shuffle(out);
}

function artTimers(dt){
 masteryTick(dt);
 // escudo
 const esl=alv('escudo');if(esl&&!shield){shieldT-=dt;if(shieldT<=0){shield=true;sparks(px,py,'#8ff0ff',10,120,7)}}

  arcs.push({x1:t.x+rnd(-20,20),y1:ST,x2:t.x,y2:t.y,t:.3,T:.3,c:'#d6b0ff'});flash(t.x,t.y,'#d6b0ff',P*20,.25);addShake(3);sparks(t.x,t.y,'#ffffff',10,180,7);
  curSrc='art:orbital';dmgE(t,R.hp(et)*(1+.5*ol)*(alv('cristal')?2:1));curSrc=null}}
 // barredora

  hbeams.push({y:low,t:.4,T:.4,c:'#b06bff'});addShake(6);scrFlash('#b06bff',.2);curSrc='art:barredora';for(const e of en)if(foe(e)&&e.y>low-EH()*1.5)dmgE(e,e.hp+1);curSrc=null}}
 if(TM.rep>0)TM.rep-=dt;
 if(TM.rb>0)TM.rb-=dt;
 // dron
 const dl=alv('dron');
 if(dl){
  const want=px-P*12<P*6?px+P*12:px-P*12;droneX+=(want-droneX)*Math.min(1,dt*8);
  if(!alv('gemelo')){droneT-=dt;if(droneT<=0&&en.length){droneT=[0,.8,.6,.45][dl];const nb=mkBullet('laser',dl,droneX,py-P*3,1);nb.src='art:dron';bullets.push(nb)}}

 // escolta: una nave aliada cruza la pantalla disparando

 const bol=alv('bolsillo');

function update(rdt){
 if(state==='pause')return;
 fxTick(rdt);
 tm+=rdt;
 shake=Math.max(0,shake-rdt*45);vigR=Math.max(0,vigR-rdt*1.8);vigC=Math.max(0,vigC-rdt*2.2);scr.a=Math.max(0,scr.a-rdt*2.5);
 if(banner.t>0)banner.t-=rdt;barGlow=Math.max(0,barGlow-rdt*4);
 xpShow+=(Math.min(1,xp/need(lv+pend))-xpShow)*Math.min(1,rdt*12);
 if(hs>0){hs-=rdt;return}
 let dt=rdt;
 if(state==='lvup'){lvT-=rdt;dt=rdt*.15;if(lvT<=0){showPick(true);return}}
 if(state==='fusein'){lvT-=rdt;dt=rdt*.15;if(lvT<=0){showFuse();return}}
 if(state==='dead')dt=rdt*.35;
 for(const s of stars){s.y+=dt*(.004+s.z*.02);if(s.y>1){s.y=0;s.x=Math.random()}}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;const f=Math.pow(p.dr,dt*60);p.vx*=f;p.vy*=f;p.t-=dt}
 parts=parts.filter(p=>p.t>0);
 for(const a of [rings,arcs,beams,hbeams])for(const r of a)r.t-=dt;
 rings=rings.filter(r=>r.t>0);arcs=arcs.filter(r=>r.t>0);beams=beams.filter(r=>r.t>0);hbeams=hbeams.filter(r=>r.t>0);
 if(state!=='play'&&state!=='lvup'&&state!=='fusein')return;
 gt+=dt;layout();
 if(kx)tx=px+kx*80;
 px+=(tx-px)*Math.min(1,dt*(ship.slow?8:14));if(Math.abs(tx-px)<.4)px=tx;
 px=Math.max(P*6,Math.min(W-P*6,px));tx=Math.max(P*6,Math.min(W-P*6,tx));
 inv-=dt;fireT-=dt;
 if(fireT<=0&&en.length){fire(slots[qi%slots.length]);qi++;fireT=interval()}
 artTimers(dt);if(state!=='play'&&state!=='lvup'&&state!=='fusein')return;
 // aparición continua
 if(mode==='sector'){waveTick(dt);rockTick(dt);cloudTick(dt);if(state!=='play'&&state!=='lvup'&&state!=='fusein')return}
 else{et=gt;
 const rate=R.rate(et)*[1,1.15,1.3,1.5][alv('avaricia')];
 spawnAcc=Math.min(spawnAcc+rate*dt,R.group(et)*2);
 if(spawnAcc>=R.group(et)&&!en.some(e=>e.y<topY()+ESP())){spawnAcc-=R.group(et);spawnRow()}
 }
 // pasos estilo Space Invaders
 stepT-=dt;
 if(stepT<=0){
  const si=R.step(et);stepT=si;stepN++;
  xoff+=((stepN%8)<4?1:-1)*P*2;
  const dy=R.speed(et)*si*[1,.88,.78,.7][alv('lastre')]*(fleetSlow>0?.8:1),floor={};let rank=0;
  for(const e of en.filter(e=>!e.dead&&!e.boss&&!e.rock).sort((a,b)=>b.y-a.y)){
   const lim=floor[e.col]==null?1e9:floor[e.col]-ESP();
   if(e.fz<=0&&!(e.charm>0)&&!(e.enter>0)&&!(e.terror>0)&&!(e.coil>0)&&!(e.brawl>0)){
    const ny=Math.min(e.y+dy*(e.slow>0?.5:1),Math.max(e.y,lim));
    // el paso se aplica en ola, de abajo arriba, como en el original
    e.sy=ny;e.sxo=xoff;e.sd=Math.min(si*.7,rank*Math.min(.014,si*.7/Math.max(1,en.length)));
   }
   floor[e.col]=e.sd!=null?e.sy:e.y;
   rank++;
  }
 }
 // estados
 for(const e of en){
  if(e.dead)continue;
  if(e.enter>0){e.enter=Math.max(0,e.enter-dt);const k=e.enter/.45;e.y=e.ey-EP*18*k*k}
  if(e.sd!=null){e.sd-=dt;if(e.sd<=0){e.y=e.sy;e.xo=e.sxo;e.anim=(e.anim||0)^1;e.hop=.08;e.sd=null}}
  if(e.hop>0)e.hop-=dt;
  e.dx=(e.dx||0)*Math.pow(.3,dt);
  // los aliens duros se balancean un poco
  const sway=e.type===1&&!(e.fz>0)?Math.round(Math.sin(tm*2.6+e.col*1.7)*1.5)*EP:0;
  if(e.rock){e.y+=e.vy*dt;e.x=e.cx;if(e.y>H+P*10){e.dead=1;continue}}
  else if(!e.boss)e.x=e.cx+(e.xo==null?xoff:e.xo)+e.dx+sway;
  // aviso antes de disparar
  if(e.aim>0){e.aim-=dt;if(e.fz>0||e.charm>0)e.aim=0;else if(e.aim<=0){ebs.push({x:e.x,y:e.y+EH(),vy:R.shotV(et),src:e});sfx('eshot');sparks(e.x,e.y+EH(),'#ff4d6d',4,80,5)}}
  e.flash-=dt;if(e.slow>0)e.slow-=dt;
  if(e.charm>0){
   // encantado: no baja y dispara hacia arriba contra los suyos
   if(e.army)e.charm=99;
   e.charm-=dt;e.cT-=dt;
   if(e.cT<=0){e.cT=e.hyp?.33:.7;bullets.push(Object.assign(blank(),{id:'laser',dmg:R.hp(et)*.35*(e.mda?2:1),spd:520,x:e.x,cx:e.x,y:e.y-EH(),vx:0,vy:-520,hit:new Set([e]),c:'#ff8fd0',c2:'#ffffff',r:P*1.5,ally:1,rp:0,fz:e.chFz||0,src:'encantados'}))}
   if(Math.random()<dt*2)addP(e.x,e.y-EH()-P*2,0,-20,.6,'#ff8fd0',7,0,1);
   if(e.mda)dmgE(e,e.max*.08*dt,1);
   if(e.guardian)e.dx+=(px-e.x)*dt*1.5;
   // encantado kamikaze (Pasión, Petardo): se lanza contra la flota y explota
   if(e.kami){e.kami.t-=dt;if(e.kami.t<=0){const k=e.kami,t=k.big?densest():nearest(e.x,e.y,()=>true);e.kami=null;const tx=t?t.x:e.x,ty=t?t.y:e.y;arcs.push({x1:e.x,y1:e.y,x2:tx,y2:ty,t:.2,T:.2,c:k.c});explode(tx,ty,k.r,k.d,{c:k.c,burn:k.burn,bt:3},null);e.charm=0;dmgE(e,e.hp+1);continue}}
   if(e.charm<=0){
    // al acabarse el encanto
    if(e.hyp){e.hyp=0;explode(e.x,e.y,P*12,R.hp(et)*1.5,{c:'#ff8fd0'},e);dmgE(e,e.hp+1)}
    else if(e.vn){e.vn=0;explode(e.x,e.y,P*12,R.hp(et),{c:'#e0d8c0'},e);execE(e)}
    else if(e.hdl&&(e.bls||0)>=5){e.hdl=0;execE(e)}
   }
   continue;
  }
  if(e.fz>0){e.fz-=dt;if(e.cryo)dmgE(e,e.max*.03*dt,1)}

function drawGlowP(p){const k=p.t/p.T;ctx.globalAlpha=Math.min(1,k*1.4);const s=p.s*(.5+.5*k);ctx.drawImage(glowTex(p.c),p.x-s/2,p.y-s/2,s,s)}
function frame(x,y,F,c){ctx.fillStyle=c;ctx.fillRect(x,y,F,2);ctx.fillRect(x,y+F-2,F,2);ctx.fillRect(x,y,2,F);ctx.fillRect(x+F-2,y,2,F)}
function draw(){
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
 ctx.save();if(shake>0)ctx.translate(Math.round(rnd(-shake,shake)),Math.round(rnd(-shake,shake)));
 for(const s of stars){ctx.fillStyle=s.z>.7?'#9aa':'#3c4646';const q=s.z>.85?P:Math.max(1,P-1);ctx.fillRect(Math.round(s.x*W),Math.round(s.y*H),q,q)}
 if(state!=='title'){const ly=Math.round(lineY());ctx.fillStyle='#4a1820';for(let x=0;x<W;x+=P*4)ctx.fillRect(x,ly,P*2,Math.max(1,P-1))}
 // barrera de energía: línea discontinua que se apaga según le quedan golpes
 if(barHP>0&&state!=='title'){const by=Math.round(barrierY()),k=barHP/barMax();ctx.globalAlpha=.35+.65*k;ctx.fillStyle='#8ff0ff';
  for(let x=Math.floor((tm*40)%(P*6))-P*6;x<W;x+=P*6)ctx.fillRect(x,by,P*4,Math.max(2,P-1));ctx.globalAlpha=1}
 // nave de escolta
 if(escort)drawSpr(ctx,['..1..','.111.','11211','1.1.1'],escort.x,py-P*28,P,{'1':'#3d7bff','2':'#ffffff'});
 // charcos
 for(const p of puddles){const k=Math.min(1,p.t/.4),x0=Math.round(p.x-p.w/2),y0=Math.round(p.y-p.h/2);
  ctx.globalAlpha=.28*k;ctx.fillStyle=p.c;ctx.fillRect(x0,y0,Math.round(p.w),Math.round(p.h));
  ctx.globalAlpha=.75*k;for(let x=x0;x<x0+p.w;x+=P*2){if(Math.floor(x/P+tm*6)%3===0)ctx.fillRect(x,y0,P,P);if(Math.floor(x/P-tm*5)%3===0)ctx.fillRect(x,y0+Math.round(p.h)-P,P,P)}
  ctx.globalAlpha=1}
 for(const m of meteors){const k=1-m.t/m.T,y=ST+(m.y-ST)*k;drawSpr(ctx,SPR.meteor,m.x,y,P,{'1':'#ff5a00','2':'#ffe0a0'})}
 // enemigos
 for(const e of en){
  if(e.dead)continue;
  const col=e.flash>0?'#ffffff':e.fz>0?'#bff8ff':ECOL[e.type];
  if(e.rainbow){drawRainbow(e);continue}
  if(e.rock){drawRock(e);continue}
  if(e.boss){drawBossPart(e,col);continue}
  if(e.block){drawSpr(ctx,ESPR[e.type][0],e.x,e.y,EP,{X:e.flash>0?'#ffffff':'#e8fbff'});ctx.globalAlpha=.35;ctx.fillStyle='#8ff0ff';ctx.fillRect(e.x-EH()-EP,e.y-EH()-EP,EH()*2+EP*2,EH()*2+EP*2);ctx.globalAlpha=1;continue}
  const fogged=clouds.length&&!e.boss&&inFog(e);if(fogged)ctx.globalAlpha=.13;
  if(e.tp>0&&e.tpW&&Math.floor(tm*20)%2){ctx.globalAlpha=fogged?.05:.3}
  let ec=e.army&&!(e.flash>0)?'#ffd0ec':e.tp>0&&!(e.flash>0)&&!(e.fz>0)?'#00e0c0':e.charm>0&&!(e.flash>0)?'#ff8fd0':e.arm>0&&!(e.flash>0)&&!(e.fz>0)?'#aab4c0':col;
  if(e.aim>0&&!(e.flash>0))ec=Math.floor(tm*16)%2?'#ffffff':'#ff4d6d';
  drawSpr(ctx,ESPR[e.type][e.anim||0],e.x,e.y-(e.hop>0?EP:0),EP,{X:ec});
  if(e.charm>0)drawSpr(ctx,SPR.charm,e.x,e.y-EH()-EP*4,EP,{'1':'#ff8fd0','2':'#ffffff'});
  if(e.hp<e.max&&!fogged){const w=EP*8,x0=Math.round(e.x-w/2),y0=Math.round(e.y+EH()+EP);ctx.fillStyle='#222';ctx.fillRect(x0,y0,w,Math.max(2,P-1));ctx.fillStyle=ECOL[e.type];ctx.fillRect(x0,y0,Math.round(w*Math.max(0,e.hp/e.max)),Math.max(2,P-1))}
  ctx.globalAlpha=1;
 }
 // nubes de niebla de la Nebulosa
 for(const c of clouds){for(let i=0;i<8;i++){const ox=Math.cos(c.ph*.7+i*1.3)*c.w*.28,oy=Math.sin(c.ph*.5+i*1.7)*c.h*.22,s=.8+.2*Math.sin(c.ph+i);ctx.globalAlpha=.7;ctx.drawImage(glowTex('#4a2275'),c.x+ox-c.w*.55*s,c.y+oy-c.h*.85*s,c.w*1.1*s,c.h*1.7*s)}
  ctx.globalAlpha=.35;ctx.drawImage(glowTex('#b06bff'),c.x-c.w*.45,c.y-c.h*.5,c.w*.9,c.h)}
 ctx.globalAlpha=1;
 // balas (pixeladas)
 const bs=P+(alv('calibre')>=2?1:0);
 for(const b of bullets){
  if(b.frag){ctx.fillStyle=b.c;ctx.fillRect(Math.round(b.x-P),Math.round(b.y-P),P*2,P*2);continue}
  if(b.refl){drawSpr(ctx,SPR.laser,b.x,b.y,P,{'1':b.c||CB,'2':'#ffffff'});continue}
  if(b.ally){drawSpr(ctx,SPR.laser,b.x,b.y,P,{'1':'#ff8fd0','2':'#ffffff'});continue}
  const L=look(b.id);drawSpr(ctx,L.rows,b.x,b.y,bs*(b.big?2:1),b.crit?{...L.map,'1':'#ffffff',a:'#ffffff'}:L.map);
 }
 for(const q of ebs){if(q.big){ctx.fillStyle='#ff4d6d';ctx.fillRect(Math.round(q.x-P*1.5),Math.round(q.y-P*1.5),P*3,P*3);ctx.fillStyle='#ffd0d8';ctx.fillRect(Math.round(q.x-P*.5),Math.round(q.y-P*.5),P,P)}else drawSpr(ctx,EB[Math.floor(q.y/(P*4))%2],q.x,q.y,P,{'1':'#ff4d6d'})}
 // nave, dron, satélites, escudo
 if(state!=='title'&&state!=='over'&&state!=='dead'){
  if(!(inv>0&&Math.floor(tm*12)%2)){
   const nx=slots.length?colorOf(slots[qi%slots.length].id):'#fff';
   // con Nave pequeña la nave se dibuja más pequeña, igual que su zona de impacto
   drawSpr(ctx,SHIP,px,py,alv('pequena')?Math.max(2,Math.round(P*hitbox())):P,{'1':ship.c,'2':nx});
   if(ship.twin){ctx.globalAlpha=.65;drawSpr(ctx,SHIP,W-px,py,P,{'1':ship.c,'2':nx});ctx.globalAlpha=1}
  }
  for(let i=0;i<bloodSh;i++)ctx.fillStyle='#c8102e',ctx.fillRect(Math.round(px-P*5+i*P*4),Math.round(py+P*6),P*3,P*2);
  if(domeT>0){ctx.globalAlpha=Math.min(1,domeT)*.7;ctx.strokeStyle='#d4af37';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py-P*4,P*24,Math.PI*1.1,Math.PI*1.9);ctx.stroke();ctx.globalAlpha=1}
  if(hasM('fire','A')){const sy=py-P*34+Math.sin(tm*3)*P;ctx.globalAlpha=.9;ctx.drawImage(glowTex('#ffb000'),px-P*8,sy-P*8,P*16,P*16);ctx.fillStyle='#ffe14d';ctx.fillRect(Math.round(px-P*2),Math.round(sy-P*2),P*4,P*4);ctx.globalAlpha=1}
  if(shield)drawSpr(ctx,['..111111111..','.1.........1.','1...........1'],px,py-P*6,P,{'1':'#8ff0ff'});
  if(alv('dron'))drawSpr(ctx,['.1.1.','11111','12121','.111.'],droneX,py+P*2,P,{'1':'#3d7bff','2':'#ffffff'});
  const sat=alv('satelites');for(let i=0;i<sat;i++){const a=tm*3+i*6.283/sat;drawSpr(ctx,['.1.','111','.1.'],px+Math.cos(a)*P*12,py+Math.sin(a)*P*12,P,{'1':'#3d7bff'})}
  if(alv('racha')&&streak>1){ctx.fillStyle='#ffffff';ctx.font='8px "Press Start 2P", monospace';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('x'+Math.min(streak,25),px+P*8,py)}
 }
 // efectos modernos
 ctx.globalCompositeOperation='lighter';
 if(markT&&!markT.dead){ctx.strokeStyle='#00c8ff';ctx.lineWidth=2;const r=EH()+P*3+Math.sin(tm*8)*P;ctx.strokeRect(markT.x-r,markT.y-r,r*2,r*2)}
 for(const t of tracers){ctx.globalAlpha=t.t/t.T;ctx.strokeStyle=t.c;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(t.x1,t.y1);ctx.lineTo(t.x2,t.y2);ctx.stroke()}ctx.globalAlpha=1;
 for(const b of beams){
  const k=b.t/b.T;ctx.globalAlpha=.25*k;ctx.fillStyle=b.c;ctx.fillRect(b.x-P*5*k,0,P*10*k,py-P*4);
  ctx.globalAlpha=.9*k;ctx.fillStyle='#ffffff';ctx.fillRect(b.x-P*.8*k,0,P*1.6*k,py-P*4);
 }
 for(const h of hbeams){const k=h.t/h.T,x1=h.x1||0,x2=h.x2==null?W:h.x2,th=h.thin?.5:1;ctx.globalAlpha=.3*k;ctx.fillStyle=h.c||'#b06bff';ctx.fillRect(x1,h.y-P*6*k*th,x2-x1,P*12*k*th);ctx.globalAlpha=.9*k;ctx.fillStyle='#ffffff';ctx.fillRect(x1,h.y-P*k*th,x2-x1,P*2*k*th)}
 for(const v of vortexes){const k=Math.min(1,v.t/.3),rot=tm*6;ctx.lineWidth=3;
  for(let i=0;i<3;i++){ctx.globalAlpha=.5*k;ctx.strokeStyle=v.c;ctx.beginPath();ctx.arc(v.x,v.y,v.r*(1-i*.28),rot+i*2,rot+i*2+2.4);ctx.stroke()}
  ctx.globalAlpha=.6*k;ctx.drawImage(glowTex(v.c),v.x-v.r*.6,v.y-v.r*.6,v.r*1.2,v.r*1.2)}
 for(const m of meteors){const k=1-m.t/m.T,y=ST+(m.y-ST)*k;ctx.globalAlpha=1;ctx.drawImage(glowTex('#ff5a00'),m.x-P*6,y-P*10,P*12,P*12);addP(m.x+rnd(-P,P),y-P*3,rnd(-10,10),-60,.25,'#ffb000',6,0,1)}
 for(const a of arcs){
  const k=a.t/a.T,pts=jag(a.x1,a.y1,a.x2,a.y2);
  for(const [w,al,c] of [[8,.16,a.c],[3.5,.45,a.c],[1.3,.95,'#ffffff']]){
   ctx.globalAlpha=al*k;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineJoin='round';ctx.beginPath();
   pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
  }
 }
 for(const r of rings){
  const k=r.t/r.T,e=1-Math.pow(k,2),rad=r.r*(.25+.75*e);
  ctx.globalAlpha=k*.9;ctx.strokeStyle=r.c;ctx.lineWidth=2+4*k;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,6.283);ctx.stroke();
  ctx.globalAlpha=k*.12;ctx.fillStyle=r.c;ctx.fill();
 }
 for(const p of parts)drawGlowP(p);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
 ctx.restore();
 if(state==='title')return;
 // viñetas y destellos de pantalla
 if(lives===1&&(state==='play'||state==='lvup'))vignette('255,40,70',.22+.12*Math.sin(tm*5));
 vignette('255,40,70',vigR*.85);vignette('120,230,255',vigC*.7);
 if(scr.a>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=scr.a;ctx.fillStyle=scr.c;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
 // HUD superior
 const bw=W-P*8,bx=P*4,by=barY(),ty=hudY();
 ctx.fillStyle='#1c2a1c';ctx.fillRect(bx,by,bw,P*2);
 ctx.fillStyle=state==='lvup'&&Math.floor(tm*16)%2?'#ffffff':'#5cff4a';ctx.fillRect(bx,by,Math.round(bw*xpShow),P*2);
 if(barGlow>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=barGlow*.8;const gx=bx+bw*xpShow;ctx.drawImage(glowTex('#5cff4a'),gx-P*8,by-P*7,P*16,P*16);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
 ctx.fillStyle='#8fa0a0';ctx.font='8px "Press Start 2P", monospace';ctx.textBaseline='top';
 ctx.textAlign='left';ctx.fillText('NV '+lv,bx,ty);
 ctx.textAlign='center';ctx.fillText(mode==='sector'?'S'+(sect+1)+' · OLEADA '+Math.max(1,wave)+'/'+nW():fmt(gt),W/2,ty);
 if(boss&&boss.ents.length){const tot=boss.ents.reduce((s,e)=>s+e.hpMax,0),left=boss.ents.reduce((s,e)=>s+(e.dead?0:Math.max(0,e.hp)),0),yb=ty+P*8,bx2=P*22,bw2=W-P*30; // empieza a la derecha del botón de pausa
  ctx.fillStyle='#2a0d14';ctx.fillRect(bx2,yb,bw2,P*2);ctx.fillStyle='#ff4d6d';ctx.fillRect(bx2,yb,Math.round(bw2*left/tot),P*2);
  ctx.fillStyle='#ff9aa8';fillTextA(BOSSES[boss.kind].n.toUpperCase(),bx2+bw2/2,yb+P*4);ctx.fillStyle='#8fa0a0'}
 if(SHOW_FPS){ctx.fillStyle='#5cff4a';ctx.fillText(fpsShow+' FPS',W/2,ty+P*5)}
 for(let i=0;i<Math.min(lives,5);i++)drawSpr(ctx,SHIP,W-P*6-i*P*8,ty+P*2,Math.max(1,Math.floor(P*.6)),{'1':'#ff4d6d','2':'#ff4d6d'});
 // disparos
 const n=slots.length,F=P*13,gap=P*4,yc=shotRowY(),x0=W/2-(n*F+(n-1)*gap)/2;
 slots.forEach((sl,i)=>{
  const x=Math.round(x0+i*(F+gap)),y=Math.round(yc-F/2),cx=x+F/2;
  let fc=isF(sl.id)?'#ffffff':sl.m?'#ffd23f':colorOf(sl.id);
  frame(x,y,F,fc);
  const L=look(sl.id),s=Math.max(1,Math.floor(F*.62/Math.max(L.rows.length,L.rows[0].length)));
  drawSpr(ctx,L.rows,cx,yc,s,L.map);
  if(!isF(sl.id))for(let k=0;k<3;k++){ctx.fillStyle=k<sl.l?'#ffffff':'#333';ctx.fillRect(Math.round(cx-P*4+k*P*3),y+F+P*2,P*2,P*2)}
  // fusión: los puntos marcan su nivel de fusión, alternando los colores de sus dos disparos
  else{const [fa,fb]=parts2(sl.id),fl=sl.fl||1;for(let k=0;k<3;k++){ctx.fillStyle=k<fl?(k%2?T[fb].c:T[fa].c):'#333';ctx.fillRect(Math.round(cx-P*4+k*P*3),y+F+P*2,P*2,P*2)}}
  if(state==='play'&&qi%n===i)drawSpr(ctx,ARROW,cx,y-P*3,Math.max(1,P-1),{'1':'#ffffff'});
 });
 // artefactos
 drawArtRow();
 drawBanner();
}
function drawArtRow(){
 const FA=P*9,ga=P*3,ya=artRowY(),xa=W/2-(artSlots*FA+(artSlots-1)*ga)/2;
 for(let i=0;i<artSlots;i++){
  const x=Math.round(xa+i*(FA+ga)),y=Math.round(ya-FA/2),a=arts[i];
  if(!a){frame(x,y,FA,'#222');continue}
  const A=ART[a.id];frame(x,y,FA,A.c);artIcon(ctx,a.id,x+FA/2,ya,FA*.7);
  let cd=0;
  if(a.id==='escudo'&&!shield)cd=shieldT/[0,20,15,10][a.l];
  if(a.id==='repulsor'&&TM.rep>0)cd=TM.rep/[0,30,22,15][a.l];
  if(a.id==='pulso')cd=TM.pulso/[0,25,20,15][a.l];
  if(a.id==='orbital')cd=TM.orb/[0,8,6,4.5][a.l];
  if(a.id==='barredora')cd=TM.bar/[0,30,25,20][a.l];
  if(a.id==='barrera'&&barHP<=0)cd=barT/barLoad();
  if(a.id==='bolsillo')cd=(TM.bol||0)/[0,15,12,9][a.l];
  if(a.id==='escolta'&&!escort)cd=(TM.esc||0)/[0,12,9,6][a.l];
  if(cd>0){ctx.fillStyle='rgba(0,0,0,.65)';const h=Math.round((FA-4)*Math.min(1,cd));ctx.fillRect(x+2,y+2,FA-4,h)}
  if(A.m>1)for(let k=0;k<3;k++){ctx.fillStyle=k<a.l?A.c:'#333';ctx.fillRect(Math.round(x+FA/2-P*2.5+k*P*2),y+FA+P,P,P)}
 }
}
// contador de FPS (temporal, para medir si va fluido en el móvil)
const SHOW_FPS=false;let fpsShow=0,fpsN=0,fpsT=0;
let last=performance.now();
function loop(t){
 const raw=(t-last)/1000,dt=Math.min(.033,raw);last=t;
 fpsN++;fpsT+=raw;if(fpsT>=.5){fpsShow=Math.round(fpsN/fpsT);fpsN=0;fpsT=0}
 update(dt);draw();placePause();requestAnimationFrame(loop)
}
// ================= PAUSA =================
const pz=document.getElementById('pz');
let pzKey='';
// el botón va debajo del texto de nivel y solo se ve mientras juegas
function placePause(){
 const show=state==='play'||state==='lvup',k=show+'|'+hudY();
 if(k===pzKey)return;pzKey=k;
 pz.classList.toggle('show',show);pz.style.top=(hudY()+P*7)+'px';pz.style.left=(P*4)+'px';
}
pz.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();if(state==='play'||state==='lvup')showPause()});
let pauseFrom='play';
function showPause(){
 sfx('pause');
 if(state!=='pause')pauseFrom=state; // al volver del catálogo seguimos en la misma pausa
 state='pause';pzKey='';placePause();
 const shotRows=slots.map((s,i)=>{const lvTxt=isF(s.id)?'FUSIÓN NV '+(s.fl||1):'NV '+s.l;return `<div class="row"><canvas width="40" height="40" data-s="${i}"></canvas><div><div class="nm">${nameOf(s.id)} · ${lvTxt}${s.m?' · <span style="color:#ffd23f">MAESTRÍA: '+MAS[s.id][s.m].n.toUpperCase()+'</span>':''}</div><div class="ds">${isF(s.id)?TW[s.id.slice(2)].d:s.m?MAS[s.id][s.m].d:T[s.id].d}</div></div></div>`}).join('');
 const artRows=arts.map((a,i)=>`<div class="row"><canvas width="40" height="40" data-a="${i}"></canvas><div><div class="nm">${ART[a.id].n}${ART[a.id].m>1?' · NV '+a.l:''}</div><div class="ds">${ARTT[a.id][a.l-1]}</div></div></div>`).join('');
 ov.innerHTML=`<div class="logo" style="font-size:20px">PAUSA</div><div class="t">${fmt(gt)} · NIVEL ${lv}</div>
  <div class="btn" id="go">CONTINUAR</div>
  <div class="eq"><div class="tag">TUS DISPAROS</div>${shotRows}${arts.length?'<div class="tag" style="margin-top:8px">TUS ARTEFACTOS</div>'+artRows:''}</div>
  <div class="btn" id="cat" style="margin-top:4px;font-size:9px;padding:10px 16px;border-color:#555;color:#c8d0d0">CATÁLOGO</div>
  <div class="btn" id="cfg" style="margin-top:0;font-size:9px;padding:10px 16px;border-color:#555;color:#c8d0d0">AJUSTES</div>
  <div class="btn" id="quit" style="margin-top:0;font-size:9px;padding:10px 16px;border-color:#5a2a32;color:#ff4d6d">ABANDONAR</div>`;
 ov.querySelectorAll('canvas[data-s]').forEach(c=>{const s=slots[+c.dataset.s],L=look(s.id),k=Math.floor(32/Math.max(L.rows.length,L.rows[0].length));drawSpr(c.getContext('2d'),L.rows,20,20,k,L.map)});
 ov.querySelectorAll('canvas[data-a]').forEach(c=>artIcon(c.getContext('2d'),arts[+c.dataset.a].id,20,20,30));
 ov.classList.add('show');ov.style.pointerEvents='auto';ov.scrollTop=0;
 document.getElementById('go').onclick=resume;
 document.getElementById('cat').onclick=()=>showCatalog(showPause);
 document.getElementById('cfg').onclick=()=>showSettings(showPause);
 // abandonar pide un segundo toque para no perder la partida sin querer
 const q=document.getElementById('quit');q.onclick=()=>{if(q.dataset.ok){showTitle();return}q.dataset.ok=1;q.textContent='¿SEGURO? TOCA OTRA VEZ'};
}
function resume(){state=pauseFrom;ov.classList.remove('show');pzKey=''}
// pausa automática si sales de la app o se apaga la pantalla
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='lvup'))showPause()});
addEventListener('blur',()=>{if(state==='play'||state==='lvup')showPause()});
// la tecla P o Escape también pausan (para probar en el ordenador)
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='Escape'){if(state==='play'||state==='lvup')showPause();else if(state==='pause'&&ov.querySelector('#go'))resume()}});

showTitle();requestAnimationFrame(loop);
</script>
