<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mazmorra de Dados</title>
<meta name="apple-mobile-web-app-title" content="Mazmorra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120e18">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e18;--panel:#1f1828;--line:#3a2e4a;--txt:#f4f0e8;--dim:#a597b8;--gold:#f8d84a;--red:#e04848;--blue:#4a8ae8;--green:#5ad05a;--dc:#f08a2a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--txt);font-family:'Press Start 2P',ui-monospace,monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{background-color:var(--bg);background-image:linear-gradient(#ffffff05 2px,transparent 2px),linear-gradient(90deg,#ffffff05 2px,transparent 2px);background-size:32px 16px}
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.btn{font:inherit;font-size:10px;color:var(--txt);background:#2a2036;border:3px solid var(--txt);padding:13px 12px;cursor:pointer;box-shadow:0 4px 0 #000;text-align:center;line-height:1.6;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.pri{background:#7a2030;border-color:#ff9a9a}
.btn.gold{background:#5a4210;border-color:var(--gold)}
.btn.small{font-size:8px;padding:9px;border-width:2px;color:var(--dim);border-color:var(--line);background:transparent;box-shadow:none}
.btn:disabled{opacity:.35;pointer-events:none}
.t{font-size:8px;line-height:2;color:var(--dim);margin:0}
.c{text-align:center}
h1{font-size:22px;line-height:1.5;margin:0;text-align:center;color:var(--gold);text-shadow:3px 3px 0 #7a2030}
h2{font-size:12px;margin:0;line-height:1.6}
h3{font-size:10px;margin:0;line-height:1.6;color:var(--gold)}
.panel{background:var(--panel);border:3px solid var(--line);padding:12px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.trio{display:flex;justify-content:center;gap:14px;align-items:flex-end}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:9px;gap:6px}
.hud span{display:flex;align-items:center;gap:6px}
.bar{height:12px;background:#000;border:2px solid #000;outline:2px solid #3a2e4a;position:relative;width:100%}
.bar i{display:block;height:100%;background:var(--red)}
.bar b{position:absolute;inset:0;font-size:7px;line-height:9px;text-align:center;font-weight:normal;text-shadow:1px 1px 0 #000}
.steps{display:flex;gap:5px;justify-content:center}
.steps i{width:22px;height:8px;background:#2a2036;border:2px solid #000}
.steps i.done{background:#7a6a90}.steps i.now{background:var(--gold)}.steps i.boss{background:#7a2030}
/* dados */
.drow{display:flex;align-items:center;gap:4px}
.drow .lb{width:62px;font-size:6px;color:var(--dim);line-height:1.5;flex:none}
.fc{width:37px;height:37px;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;position:relative;flex:none;color:var(--txt);font-family:inherit;padding:0}
.fc.atk{border-color:#e04848;background:#3a1218}.fc.def{border-color:#4a8ae8;background:#121e3a}.fc.esp{border-color:var(--dc);background:#2a2010}
.fc.blank b{color:#5a5068}
button.fc{cursor:pointer}
button.fc:active{transform:scale(.9)}
.pick .fc.off{opacity:.25;pointer-events:none}
.die{width:86px;height:86px;font-size:18px;border-width:4px;box-shadow:0 5px 0 #000;gap:6px}
.die.boost b{color:var(--gold)!important}
.die.can{cursor:pointer}
.die.q b{color:#5a5068}
.dice{display:flex;justify-content:center;gap:14px}
.dlab{display:flex;justify-content:center;gap:14px}
.dlab span{width:86px;text-align:center;font-size:7px;color:var(--dim)}
.combo{text-align:center;font-size:13px;color:var(--gold);text-shadow:2px 2px 0 #7a2030;min-height:16px}
.ftxt{font-size:8px;line-height:2;color:var(--dim);min-height:48px;text-align:center}
.ftxt em{font-style:normal;color:var(--txt)}
/* combate */
.arena{border:3px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:14px;position:relative}
.enemies{display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:150px}
.en{display:flex;flex-direction:column;align-items:center;gap:5px;width:31%;max-width:140px;cursor:pointer;padding:6px 2px;border:2px solid transparent}
.en.tgt{border-color:var(--gold)}
.en.dead{opacity:.2;filter:grayscale(1)}
.en .nm{font-size:7px;text-align:center;line-height:1.4}
.intent{display:flex;gap:6px;font-size:10px;min-height:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.intent span{display:flex;align-items:center;gap:2px}
.badges{display:flex;gap:6px;font-size:8px;min-height:14px;flex-wrap:wrap;justify-content:center}
.badges span{display:flex;align-items:center;gap:2px}
.herorow{display:flex;align-items:center;gap:12px;padding:0 6px}
.hstat{flex:1;display:flex;flex-direction:column;gap:6px}
.acts{display:flex;flex-direction:column;gap:8px}
/* puertas */
.doors{display:flex;gap:8px}
.door{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;font-size:9px}
.door small{font-size:7px;color:var(--dim);line-height:1.6}
.relics{display:flex;gap:6px;flex-wrap:wrap}
.relics button{background:#0006;border:2px solid var(--line);padding:3px;cursor:pointer}
.opt{display:flex;align-items:center;gap:12px;text-align:left}
.opt small{display:block;font-size:7px;color:var(--dim);margin-top:4px}
.opt .price{margin-left:auto;color:var(--gold);white-space:nowrap}
.hero-card{display:flex;gap:12px;align-items:center;text-align:left}
.hero-card .info{flex:1;display:flex;flex-direction:column;gap:6px}
.hero-card small{font-size:7px;color:var(--dim);line-height:1.7}
/* efectos */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.fl{position:absolute;font-size:14px;text-shadow:2px 2px 0 #000;animation:up .9s steps(9) forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.shake{animation:sh .3s steps(3)}
@keyframes sh{33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:16px;color:var(--gold);text-shadow:3px 3px 0 #7a2030;z-index:60;animation:pop 1s steps(5) forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6)}20%{transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
.modal{position:fixed;inset:0;background:#000c;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .panel{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.help p{font-size:8px;line-height:2.1;color:var(--dim);margin:0}
.help b{color:var(--txt);font-weight:normal}

/* ---------- falso 3D y pulido visual ---------- */
body{background:radial-gradient(ellipse at 50% 30%,#1c1626 0%,#0b0910 70%) fixed,#0b0910}
canvas.px3d{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.panel{border:none;background:linear-gradient(#ffffff08,#0000 40%),var(--panel);box-shadow:0 0 0 2px #000,0 0 0 5px #3a2e4a,0 0 0 7px #000,inset 0 2px 0 #ffffff12,inset 0 -3px 0 #0006}
.btn{border:none;box-shadow:0 0 0 3px #000,inset 0 3px 0 #ffffff22,inset 0 -4px 0 #0008,0 6px 0 0 #000;background:linear-gradient(#3a2e4a,#241c30)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 3px #000,inset 0 3px 0 #ffffff22,inset 0 -2px 0 #0008,0 2px 0 0 #000}
.btn.pri{background:linear-gradient(#a03040,#6a1826);border:none;text-shadow:2px 2px 0 #000}
.btn.gold{background:linear-gradient(#ffe46a,#e0b42a);border:none;color:#1a1020;text-shadow:1px 1px 0 #fff4c0}
.btn.small{box-shadow:none;background:transparent;border:2px solid var(--line)}
.btn.small:active{transform:none}
.logo{font-size:26px;letter-spacing:1px;text-shadow:3px 3px 0 #7a2030,6px 6px 0 #000}
.fig{position:relative;display:inline-block;isolation:isolate;animation:none}
.fig::after{content:'';position:absolute;left:12%;right:12%;bottom:-5px;height:9px;background:#000a;border-radius:50%;z-index:-1}
.fig>*{animation:bob 1.4s steps(2) infinite;animation-delay:inherit}
@keyframes bob{50%{transform:translateY(-3px)}}
.fig.hit>*{animation:flash .32s steps(1)}
@keyframes flash{0%{filter:brightness(0) invert(1)}35%{filter:brightness(0) invert(1) sepia(1) saturate(6) hue-rotate(-30deg)}70%{filter:none}}
.fig.lungeL{animation:lungeL .36s steps(4)}
@keyframes lungeL{45%{transform:translate(-22px,10px) scale(1.08)}}
.fig.lungeR{animation:lungeR .36s steps(4)}
@keyframes lungeR{45%{transform:translate(26px,-14px) scale(1.06)}}
.pt{position:absolute;width:5px;height:5px;box-shadow:0 0 0 1px #000;animation:pt .5s steps(6) forwards;z-index:55}
@keyframes pt{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.quake{animation:quake .3s steps(4)}
@keyframes quake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.fl{font-size:15px;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
/* arena 3D */
.arena{position:relative;overflow:hidden;border:none;min-height:300px;justify-content:space-between;box-shadow:0 0 0 3px #000,0 0 0 6px #3a2e4a,0 0 0 8px #000;background:#000}
.arena>canvas{position:absolute;left:0;top:0;z-index:0}
.arena>.enemies,.arena>.herorow{position:relative;z-index:1}
.enemies{padding-top:4px}
.en{background:none}
.en.tgt{border-color:transparent;background:radial-gradient(ellipse at 50% 70%,#f8d84a22,transparent 70%)}
.en.tgt .nm{color:var(--gold)}
.en.tgt .nm::before{content:'▶ ';}
.en .nm,.herorow .hstat>div:first-child{text-shadow:2px 2px 0 #000}
.herorow{padding:0 6px 4px}
.hstat{background:#000a;padding:6px;box-shadow:0 0 0 2px #000}
/* bandeja de dados */
.trayw{position:relative;width:100%;box-shadow:0 0 0 3px #000,0 0 0 6px #3a2016,0 0 0 8px #000;background:#000;cursor:pointer}
.trayw .combo{position:absolute;left:0;right:0;top:8px;pointer-events:none;z-index:2}
.tray-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#f4f0e8;text-shadow:2px 2px 0 #000;pointer-events:none;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.chips{display:flex;justify-content:center;gap:12px;font-size:7px;color:var(--dim)}
.chips span{display:flex;align-items:center;gap:5px}
.chips i{width:11px;height:11px;border:2px solid;display:block}
/* pasillo */
.view{position:relative;width:100%;height:340px;background:#000;box-shadow:0 0 0 3px #000,0 0 0 6px #3a2e4a,0 0 0 8px #000;cursor:pointer;overflow:hidden}
.view canvas{position:absolute;left:0;top:0}
.view-t{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:10px;text-shadow:2px 2px 0 #000;z-index:1;pointer-events:none}
#bgview{position:fixed;inset:0;z-index:-1;opacity:.55}
.door{padding:10px 4px}

.dl3{position:absolute;transform:translateX(-50%);text-align:center;font-size:7px;line-height:1.5;z-index:2;cursor:pointer;text-shadow:2px 2px 0 #000;max-width:110px;white-space:nowrap;padding:4px 5px;background:#000a;box-shadow:0 0 0 2px #000;animation:glow 1.6s steps(2) infinite}
.dl3 small{display:block;font-size:6px;line-height:1.5;color:var(--dim);margin-top:2px}
.dl3.boss b{color:#ff8a8a}
@keyframes glow{50%{box-shadow:0 0 0 2px #000,0 0 0 4px #f8d84a55}}

.hearts{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin:0 auto}
.hearts img{filter:drop-shadow(1px 1px 0 #000)}
.hstat .hearts,.panel .hearts,.hudhp .hearts,.hero-card .hearts{justify-content:flex-start;margin:0}
.hudhp{margin-top:-4px}

/* escena de combate */
.scene{position:relative;width:100%;background:#000;box-shadow:0 0 0 3px #000,0 0 0 6px #3a2e4a,0 0 0 8px #000;overflow:hidden;cursor:pointer;flex:none}
.scene canvas{position:absolute;left:0;top:0}
#ovs{position:absolute;inset:0;pointer-events:none;z-index:2}
.ov{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:2px 2px 0 #000;white-space:nowrap}
.ov .nm{font-size:6px;color:#e8e0f0}
.ov .intent{background:#000b;padding:3px 5px;box-shadow:0 0 0 2px #000;font-size:9px;gap:5px;min-height:0}
.ov .intent s{font-size:6px;color:#8a8a9a;margin-left:2px}
.ov .hearts img{width:7px;height:7px}
.ov .hearts.big img{width:10px;height:10px}
.ov .hearts{gap:1px;max-width:none!important;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96px!important}
.ov.hero{transform:translate(-30%,-100%)}
.ov.pick::before{content:'▼';color:var(--gold);font-size:12px;animation:blink .7s steps(2) infinite;order:-1}
.ov.pick .nm{color:var(--gold)}
.ov.nope{opacity:.45}
.dk{position:absolute;transform:translate(-50%,-100%)}
.tap-hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:9px;text-shadow:2px 2px 0 #000;animation:blink 1.2s steps(2) infinite}
.phase{background:var(--panel);box-shadow:0 0 0 2px #000,0 0 0 5px #3a2e4a,0 0 0 7px #000;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ph-t{font-size:8px;color:var(--gold);line-height:1.5}
.ph-t .gold{color:#fff4a0}
.ph-d{font-size:7px;line-height:1.9;color:var(--dim)}
.ph-d b{color:var(--txt);font-weight:normal}
.dchips{display:flex;flex-direction:column;gap:4px}
.dchip{display:flex;align-items:center;gap:8px;font:inherit;font-size:7px;line-height:1.6;color:var(--dim);background:#0006;border:none;box-shadow:0 0 0 2px #000;padding:3px 6px;text-align:left;cursor:pointer}
.dchip b{display:block;color:var(--txt);font-weight:normal}
.dchip .fc{width:28px;height:28px}
.dchip.on{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold)}
.dchip.lk{box-shadow:0 0 0 2px #000,0 0 0 4px #c8e6ff}
.dchip.lk span::after{content:' · guardado';color:#c8e6ff}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}

.pipw{display:flex;align-items:center;gap:4px}
.pips{display:grid;gap:2px;width:max-content}
.pips i{display:block;width:3px;height:6px;background:#e04848;box-shadow:0 0 0 1px #000}
.pips.mid i{width:5px;height:8px}
.pips.big i{width:8px;height:11px}
.pips i.e{background:#2c1a20}
.pips i.y{background:#f8d84a;animation:pipb .9s steps(2) infinite}
.pips i.g{background:#5ad05a;animation:pipb .9s steps(2) infinite}
.pips i.b{background:#4a8ae8}
.pips i.x{background:#9ac8ff}
@keyframes pipb{50%{filter:brightness(.55)}}
.skull{animation:blink .6s steps(2) infinite}
.hbarw{flex:none;margin-top:-4px}
.hbar{position:relative;background:#000c;box-shadow:0 0 0 2px #000,0 0 0 4px #3a2e4a;padding:6px 8px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.hb-top{display:flex;justify-content:space-between;align-items:center;font-size:7px;color:#e8e0f0}
.hb-top .badges{min-height:0}
.dtag{position:absolute;transform:translate(-50%,-100%);font-size:9px;color:#000;background:var(--gold);padding:2px 4px;box-shadow:0 0 0 2px #000;animation:blink 1s steps(2) infinite}
.dchip .tag{font-style:normal;color:#000;background:var(--gold);padding:1px 3px;margin-left:4px}
.dchip.cb .fc{box-shadow:0 0 0 2px var(--gold)}
.coach{position:fixed;z-index:80;pointer-events:none;background:#fff4d6;color:#1a1020;font-size:9px;line-height:1.8;padding:10px 12px;box-shadow:0 0 0 3px #000,4px 4px 0 3px #0008;animation:pop2 .25s steps(3)}
.coach .ct{margin-bottom:2px}
.coach .cb{pointer-events:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.coach .cb .btn{width:auto;padding:8px 14px;font-size:9px}
.coach .skip{font:inherit;font-size:6px;color:#7a6a80;background:none;border:none;text-decoration:underline;padding:0;cursor:pointer}
.coach.up::after,.coach.down::after{content:'';position:absolute;left:calc(var(--ax) - 7px);border:7px solid transparent}
.coach.up::after{top:100%;border-top-color:#fff4d6}
.coach.down::after{bottom:100%;border-bottom-color:#fff4d6}
@keyframes pop2{0%{transform:scale(.8)}}
.coach-hl{outline:3px solid var(--gold)!important;outline-offset:3px;animation:hlp .8s steps(2) infinite}
@keyframes hlp{50%{outline-color:#fff4d6}}

.dov{position:absolute;transform:translate(-50%,-100%);display:flex;gap:3px;align-items:center}
.dov .dtag{position:static;transform:none}
.dlk{background:#000c;padding:2px;box-shadow:0 0 0 2px #000;display:flex}
.dlk.ice{background:#0a3a50;box-shadow:0 0 0 2px #000,0 0 0 3px #9ae0ff}
.fc.cursed{box-shadow:0 0 0 2px #000,0 0 0 3px #d090ff!important;background:#3a1650!important}
.rg{font-size:7px;color:#ff7050;margin-left:2px;display:inline-flex;align-items:center;gap:1px}
.card{width:100px;background:linear-gradient(#2a2036,#15101c);box-shadow:0 0 0 2px #000,0 0 0 4px var(--rc),0 0 0 6px #000;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.card .cnum{position:absolute;top:4px;left:5px;font-size:6px;color:var(--rc)}
.card .cart{height:84px;display:flex;align-items:flex-end;justify-content:center;width:100%;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--rc) 30%,transparent),transparent 70%)}
.card .cname{font-size:6px;line-height:1.4;text-align:center;min-height:17px;display:flex;align-items:center}
.card .crar{font-size:7px;color:var(--rc)}
.card.big{width:220px;padding:10px 8px 12px;gap:8px}
.card.big .cart{height:190px}
.card.big .cname{font-size:10px}
.card.big .cnum{font-size:8px}
.card.missing{filter:saturate(.3)}
.card.missing .cname{color:#5a5068}
.card.r3:not(.missing){animation:leg 1.6s steps(2) infinite}
@keyframes leg{50%{box-shadow:0 0 0 2px #000,0 0 0 4px #fff4a0,0 0 0 6px #000}}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;justify-items:center}
.cbtn{background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit}
.reveal{animation:flip .7s steps(7)}
@keyframes flip{0%{transform:perspective(500px) rotateY(90deg) scale(.6)}100%{transform:none}}

.eband{position:relative;height:var(--ebh,50px);background:linear-gradient(#0d0a12,#16111e);box-shadow:0 0 0 3px #000,0 0 0 6px #3a2e4a,0 0 0 8px #000;flex:none;z-index:3}
.ecard{position:absolute;top:5px;transform:translateX(-50%);display:flex;flex-direction:column;gap:3px;padding:4px 6px;background:#000a;box-shadow:0 0 0 2px #000;cursor:pointer}
.ecard{overflow:hidden}
.ecard .ec-top{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;row-gap:2px}
.ecard .nm{font-size:7px;color:#e8e0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecard .intent{display:flex;gap:4px;font-size:9px;align-items:center;flex:none;margin-left:auto}
.ecard .badges{min-height:0;justify-content:flex-start;font-size:7px}
.ecard.pick{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold);animation:hlp .8s steps(2) infinite}
.ecard.pick .nm{color:var(--gold)}
.ecard.nope{opacity:.4}
.pips.en i{width:4px;height:5px}
.pips.en{gap:1px}
.ov .nm{visibility:hidden}

.dinfo.use .fc{width:28px;height:28px}

.dinfo.on{box-shadow:0 0 0 2px #000,0 0 0 4px var(--gold)}
.dinfo.cb .fc{box-shadow:0 0 0 2px var(--gold)}
.dinfo .tag{font-style:normal;color:#000;background:var(--gold);padding:1px 3px;margin-left:4px}

.topbar{display:flex;align-items:center;margin-bottom:-2px}
.topbar .back{font:inherit;font-size:9px;color:var(--txt);background:#2a2036;border:none;box-shadow:0 0 0 2px #000,0 0 0 4px #3a2e4a;padding:9px 12px;cursor:pointer}

.modal .panel{position:relative;max-height:calc(100dvh - 40px);overflow:auto}
.mclose{position:sticky;top:0;align-self:flex-end;margin:-4px -4px -30px 0;z-index:2;font:inherit;font-size:12px;width:34px;height:34px;color:var(--txt);background:#3a2e4a;border:none;box-shadow:0 0 0 2px #000;cursor:pointer;flex:none}
.version{font-size:7px;opacity:.7}
.scard{display:flex;gap:12px;align-items:center}
.srow{display:flex;justify-content:space-between;gap:8px;font-size:8px;line-height:1.8;color:var(--dim)}

function rollCard(chance) {
  if (FAST || Math.random() >= chance * (has('recuerdos') ? 2 : 1)) return null;
  const own = albumGet(), left = CARDS.filter(c => !own.has(c.id));
  if (!left.length) return null;

    for (const d of live) { this.updFly(d, now); const h = Math.max(0, d.pos[1] - DS); floorShadow(s, cam, d.pos[0] - h * .3, d.pos[2] - h * .25, DS * 1.4 * (1 - Math.min(.4, h * .1)), .5); }
    // de atrás hacia delante
    const items = figs.map(f => ({ z: proj(cam, [f.x, 0, f.z])[2], f })).concat(live.map(d => ({ z: proj(cam, d.pos)[2] - .4, d })));
    items.sort((a, b) => b.z - a.z);
    const idb = this.idb.fill(0), outl = [0];
    let id = 0;
    for (const it of items) {
      if (it.f) { this.blitFig(it.f, now); continue; }
      const d = it.d; id++;
      outl[id] = d.sel ? pack(255, 255, 255) : d.boost ? pack(248, 216, 74) : d.locked && d.kind === 'p' && C && C.frozen && C.frozen[d.d] ? pack(120, 240, 255) : d.locked ? pack(160, 210, 255) : d.kind === 'e' ? pack(40, 6, 10) : pack(8, 5, 7);
      const texFn = d.kind === 'e' ? fi => enemyFaceTex(d.en.f[d.map[fi]]) : (fi, plain) => faceTex(d.d, run.dice[d.d][d.map[fi]], false, plain);
      if (d.fade) { const k = Math.min(1, (now - d.fade) / 450); if (k >= 1) { d.gone = true; continue; } d.fk = k; } else d.fk = 0;
      drawCube(s, idb, cam, d, texFn, id);
      if (d.fk) for (let i = 0; i < buf.length; i++) if (idb[i] === id && BAYER[((i / W | 0) & 3) * 4 + (i % W & 3)] < d.fk) { buf[i] = this.bg[i]; idb[i] = 0; }
      if (d.dim) for (let i = 0; i < buf.length; i++) if (idb[i] === id) buf[i] = shadeC(buf[i], .45);
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x; if (idb[i]) continue;
      const n = (x > 0 && idb[i - 1]) || (x < W - 1 && idb[i + 1]) || (y > 0 && idb[i - W]) || (y < H - 1 && idb[i + W]);
      if (n) buf[i] = outl[n];
    }
    this.figs = figs;
    blit(s);
  },
  blitFig(f, now) {
    const s = this.s, cam = this.cam, depth = proj(cam, [f.x, 0, f.z])[2];
    const scale = Math.max(.5, Math.round(f.v * cam.focal / depth * 4) / 4);
    const yq = Math.round((f.yaw + Math.sin(now / 1000 * .8 + f.ph) * .22) / .04);
    const fr = V3D.frameS(f.name, scale, yq, .5);
    const [sx, sy] = proj(cam, [f.x + f.ox, 0, f.z + f.oz]);
    const bob = Math.sin(now / 1000 * 3.4 + f.ph) > .3 ? 1 : 0;
    const x0 = Math.round(sx - fr.ax), y0 = Math.round(sy - fr.ay) - bob;
    const flash = f.fx.flash && now < f.fx.flash, fade = f.fx.die ? Math.min(1, (now - f.fx.die) / 550) : 0;
    const { W, H, buf } = s, white = pack(255, 250, 240), red = pack(255, 90, 80);
    for (let y = 0; y < fr.ch; y++) { const Y = y0 + y; if (Y < 0 || Y >= H) continue; for (let x = 0; x < fr.cw; x++) {
      const X = x0 + x; if (X < 0 || X >= W) continue;
      const c = fr.buf[y * fr.cw + x]; if (!c) continue;
      if (fade && BAYER[(Y & 3) * 4 + (X & 3)] < fade) continue;
      buf[Y * W + X] = flash ? ((x + y) & 1 ? white : red) : c;
    } }
    f.bb = [x0, y0, x0 + fr.cw, y0 + fr.ch];
  },
  updFly(d, now) {
    if (!d.fly) return;
    const p = Math.min(1, (now - d.fly.t0) / 300), a = d.fly.from, b = d.fly.to;
    d.pos = [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p + Math.sin(p * Math.PI) * 1.2, a[2] + (b[2] - a[2]) * p];
    d.q = Q4.norm(Q4.mul(Q4.axis([1, 0, 0], .35), d.q));
    if (p >= 1) d.gone = true;
  },
  // lanza los dados de la lista (los demás se quedan quietos como obstáculos)
  throw(list) {
    if (!this.s.W) return Promise.resolve();
    const all = this.dice.filter(d => !d.gone);
    const bodies = all.map(d => ({ pos: d.pos ? d.pos.slice() : [50, DS, 50], q: d.q ? d.q.slice() : [1, 0, 0, 0], vel: [0, 0, 0], w: [0, 0, 0], dyn: list.includes(d), rest: 0, sleep: false, P: d.kind === 'e' ? ZONE_E : ZONE_P }));
    let k = 0;
    all.forEach((d, i) => {
      if (!list.includes(d)) return;
      const b = bodies[i], r = Math.random;
      if (d.kind === 'e') { const x = this.figOf(d.en).tx; b.pos = [x + (r() - .5) * .6, 1.4 + r() * .4, -1.8]; b.vel = [(r() - .5) * 2.4 - x * .3, 1.2 + r(), 2.2 + r() * 1.4]; }
      else { b.pos = [3, 1.3 + r() * .6, .55 + k * .85]; b.vel = [-(3.8 + k * 1.3 + r() * 2.2), 1 + r() * 1.6, (r() - .5) * 2]; k++; }
      b.w = [(r() - .5) * 26, (r() - .5) * 26, (r() - .5) * 26]; b.q = Q4.rand();
    });
    const sim = simulate(bodies);
    all.forEach((d, i) => {
      if (!list.includes(d)) return;
      const top = sim.top[i], map = new Array(6), rest = [0, 1, 2, 3, 4, 5].filter(x => x !== d.want);
      d.rest = false; map[top] = d.want; for (let c = 0; c < 6; c++) if (c !== top) map[c] = rest.shift();
      d.map = map; d.top = top;
    });
    return new Promise(res => {
      const t0 = performance.now(); let si = 0;
      const step = now => {
        const f = Math.max(0, Math.min(sim.frames.length - 1, Math.floor((now - t0) / 16.67)));
        sim.frames[f].forEach((st, i) => { if (bodies[i].dyn) { all[i].pos = st.pos; all[i].q = st.q; } });
        while (si < sim.sounds.length && sim.sounds[si][0] <= f) { Sfx.clack(sim.sounds[si][1]); si++; }
        if (f >= sim.frames.length - 1) { const t = performance.now(); list.forEach(d => { d.rest = true; d.restT = t; }); return res(); }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  },
  pdie(d) { return this.dice.find(x => x.kind === 'p' && x.d === d && !x.gone); },
  edie(e) { return this.dice.find(x => x.kind === 'e' && x.en === e && !x.gone); },
  tap(ev) {
    if (!C || S.scr !== 'combat') return;
    const r = this.s.cv.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * this.s.W, y = (ev.clientY - r.top) / r.height * this.s.H;
    let best = null, bd = 1e9;
    for (const d of this.dice) { if (d.gone || d.fly || d.fade || !d.pos) continue; const p = proj(this.cam, d.pos), dd = Math.hypot(p[0] - x, p[1] - y); if (dd < bd) { bd = dd; best = d; } }
    if (best && bd < this.s.W * .075) return best.kind === 'p' ? G.tapDie(best.d) : G.tapEnemy(C.en.indexOf(best.en));
    for (const f of [...this.figs].reverse()) if (f.bb && x >= f.bb[0] && x < f.bb[2] && y >= f.bb[1] && y < f.bb[3]) return f.ref === 'hero' ? G.tapHero() : G.tapEnemy(C.en.indexOf(f.ref));
    G.tapFloor();
  },
};

const Sfx = {
  on: (() => { try { return localStorage.getItem('mazmorra_sfx') !== '0'; } catch (e) { return true; } })(), ctx: null,
  init() { if (!this.ctx) try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  toggle() { this.on = !this.on; try { localStorage.setItem('mazmorra_sfx', this.on ? '1' : '0'); } catch (e) {} },
  noise(len, freq, q, vol) {
    const c = this.ctx, n = Math.floor(c.sampleRate * len), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  },
  clack(v) { if (!this.on || !this.ctx || FAST) return; this.noise(.035, 1700 + Math.random() * 1500, 4, .35 * v + .05); },
  hit(v = 1) {
    if (!this.on || !this.ctx || FAST) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'square'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
    g.gain.setValueAtTime(.08 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .16);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .17);
    this.noise(.08, 600, 1, .12 * v);
  },
};

function wpick(w) { let t = 0; for (const k in w) t += w[k]; let x = Math.random() * t; for (const k in w) { x -= w[k]; if (x < 0) return k; } return Object.keys(w)[0]; }
function genDoors(s) {
  if (s === STEPS - 1) return ['jefe'];
  if (s === 0) return ['combate'];
  const w = { combate: 34, evento: 20, forja: 11, altar: 5, elite: s >= 2 ? 12 : 0, descanso: s >= 3 ? 9 : 0, tienda: s >= 2 ? 10 : 0 };
  const n = has('mapa') || Math.random() < .55 ? 3 : 2, out = [];
  if (s === STEPS - 2) out.push('descanso');
  while (out.length < n) { const t = wpick(w); if (!out.includes(t)) out.push(t); }
  return shuffle(out);
}

// ---------------------------------------------------------- barra de vida de puntitos
// rojo = vida · amarillo = lo que te van a quitar los golpes · azul = lo bloqueado
// (y escudo que sobra, al final) · verde = lo que te quitará el veneno · oscuro = perdida
function pips(hp, max, o = {}) {
  hp = Math.max(0, Math.min(hp, max));
  const risk = Math.min(hp, o.inc || 0), blocked = Math.min(o.blk || 0, risk), yellow = risk - blocked;
  const green = Math.min(hp - risk, o.poi || 0), safe = hp - risk - green, extra = Math.max(0, (o.blk || 0) - blocked);
  const row = o.row || (max <= 12 ? max : max <= 30 ? 15 : 20);
  let h = '';
  for (let i = 0; i < max; i++) h += `<i class="${i < safe ? 'r' : i < safe + blocked ? 'b' : i < safe + blocked + yellow ? 'y' : i < hp ? 'g' : 'e'}"></i>`;
  for (let i = 0; i < extra; i++) h += '<i class="x"></i>';
  const dead = o.inc !== undefined && hp > 0 && yellow + green >= hp;
  return `<div class="pipw">${dead ? `<span class="skull">${sp('calavera', 2)}</span>` : ''}<div class="pips ${o.cls || ''}" style="grid-template-columns:repeat(${row},auto)">${h}</div></div>`;
}
function hearts(hp, max) { return pips(hp, max, { cls: 'mid', row: 20 }); }
// lo que te viene este turno (golpes y veneno de los enemigos que aún no han actuado)
function incoming() {
  let inc = 0, poi = C.ppoison;
  if (C.phase !== 'enemy') for (const e of alive()) if (e.intent && !e.acted) { if (e.stun) continue; if (e.intent.a) inc += Math.max(0, e.intent.a + e.rage - (e.weak || 0)) * (e.multi || 1); poi += e.intent.p + e.intent.q; }
  return { inc, poi };
}

      { el: '#btn-roll', t: 'Tira tus dados.', on: 'roll' },
      { el: '#dz-atk', t: 'Buen ataque. Tócalo para guardarlo.', on: 'lock:atk' },

  if (C.rolled && ['reroll', 'use'].includes(C.phase)) DKEYS.forEach(d => { const sd = Scene.pdie(d); if (!sd || C.used[d] || sd.fly || !sd.pos) return; const [x, y] = Scene.css(sd.pos); ov += `<div class="danc" id="dz-${d}" style="left:${x - 22}px;top:${y - 26}px"></div>`; });
  if (C.phase === 'roll' && !Tuto.on) ov += `<div class="tap-hint">Toca para tirar tus dados</div>`;
  $('#ovs').innerHTML = ov;
  flushFx();
  // pistas de la primera vez
  if (eff && eff.combo && (C.phase === 'reroll' || C.phase === 'use')) Tips.show(eff.combo === '¡Trío!' ? 'trio' : 'pareja', eff.combo === '¡Trío!' ? '¡Trío! Tus tres dados son del mismo color: los tres valen el doble.' : '¡Pareja! Dos dados del mismo color: cada uno suma +1.', '.dinfo.cb .tag');
  if (C.phase === 'roll') { const i = C.en.findIndex(e => e.hp > 0 && e.intent && e.intent.b); if (i >= 0) Tips.show('eblock', 'Este enemigo se protege (azul): tu daño primero rompe esos cuadraditos.', '#ec-' + i + ' .pipw'); }
  if (C.phase === 'use' && C.sel === 'atk' && eff && eff.fs.some(f => (f.k === 'furia' || f.k === 'doble') && !C.used[f.d] && !blankF(f))) Tips.show('order', 'Consejo: usa antes la furia o el rayo, y así este ataque valdrá más. Toca "Cancelar" si quieres cambiar.', '#dz-esp');
  if (C.phase === 'roll' && inc.poi) Tips.show('poison', 'Lo verde es veneno: te quita vida al final del turno y la protección no lo para.', '#hbar');
  if ((C.phase === 'reroll' || C.phase === 'use') && run.hp > 0 && inc.inc - C.block + inc.poi >= run.hp) Tips.show('skull', '¡Cuidado! La calavera avisa: si no te proteges o matas a alguien, mueres este turno.', '#hbar');
  Coach.draw();
}
async function winCombat() {
  if (!C || C.won) return; C.won = true;
  if (Tuto.on) Tuto.finish();
  Coach.draw();
  await sleep(600);
  const kind = C.kind;
  let g = kind === 'jefe' ? 40 + run.floor * 10 : kind === 'elite' ? 20 + run.floor * 5 : kind === 'mimico' ? 30 + run.floor * 10 : R(6, 10) + run.floor * 3;
  if (has('bolsa')) g = Math.round(g * 1.5);
  if (D2()) g = Math.round(g * .75);
  run.gold += g;
  if (has('colmillo')) heal(4);
  uncurse();
  C = null;
  const card = kind === 'jefe' || kind === 'elite' || kind === 'mimico' ? rollCard(CARD_CHANCE[kind]) : null;
  const withCard = f => card ? cardReveal(card, f) : f();
  if (kind === 'jefe') {
    run.hp = run.maxHp;
    if (run.floor >= FLOORS.length - 1) return withCard(victory);
    return withCard(() => evolve(() => relicChoice('Tesoro del jefe', nextFloor)));
  }
  if (kind === 'elite') return withCard(() => relicChoice(`¡Élite vencido! +${g} de oro`, nextRoom));
  if (kind === 'mimico') return withCard(() => reward(g));
  reward(g);
}
async function lose() { await sleep(600); uncurse(); C = null; Tuto.on = false; Coach.draw(); gameOver(); }

// ---------------------------------------------------------- acciones (botones)
const G = {
  title, choose: dungeonScreen, help, map,
  start: k => newRun(k),
  cont: () => { run = load(); if (!run) return title(); setDungeon(run); giveSuits(run); DKEYS.forEach(d => run.dice[d].forEach(f => { if (f.k === 'doble' && f.v < 2) f.v = 2; })); map(); },
  pickD: (dg, diff) => { NEXT = { dg, diff }; chooseHero(); },
  vtap: () => { G._vt = (G._vt || 0) + 1; if (G._vt === 5) { progSet({ won1: true }); toast('Modo pruebas: todo desbloqueado'); } },
  door: i => {
    if (S.walking) return;
    if (FAST || !Corr.room || !$('#view')) return enter(run.doors[i]);
    Sfx.hit(.3);
    S.walking = 1;
    Corr.walk(i, () => enter(run.doors[i]));
  },
  sfx: () => { Sfx.toggle(); title(); },
  roll: () => { if (C && C.phase === 'roll' && !C.busy && Tuto.expect('roll')) doRoll(); },
  reroll: () => { if (C && C.phase === 'reroll' && !C.busy && Tuto.expect('reroll')) rerollDice(); },
  ready: () => { if (C && C.phase === 'reroll' && !C.busy && Tuto.expect('ready')) toUse(); },
  end: () => { if (Tuto.expect('end')) endTurn(); },
  auto: () => { if (Tuto.expect('auto')) autoPlay(); },
  use: t => { if (C && C.sel && !C.busy && Tuto.expect('use:' + C.sel)) useDie(C.sel, t); },
  useAll: () => { if (C && C.sel && !C.busy && Tuto.expect('use:' + C.sel)) useDie(C.sel, alive()[0]); },
  tapDie: d => {
    if (!C || C.busy) return;
    if (C.phase === 'reroll') { if (Tuto.expect('lock:' + d)) toggleLock(d); }
    else if (C.phase === 'use') { if (C.used[d]) return; if (C.sel === d && Tuto.on) return; if (Tuto.expect('sel:' + d)) selDie(d); }
    else if (C.phase === 'roll') G.roll();
  },
  album: () => albumScreen(),
  face: (ev, d, i) => { if (ev) ev.stopPropagation(); const f = run && run.dice[d][i]; if (f) showTip(ev.currentTarget, f.cursed ? 'Maldita: esta cara está vacía hasta que acabe el combate.' : faceInfo(d, f)); },
  stats: () => statsScreen(),
  cardOk: () => { const a = S.after; a && a(); },
  cardView: id => { const c = CARDS.find(x => x.id === id), own = albumGet().has(id); modal(`<div class="c" style="display:flex;flex-direction:column;align-items:center;gap:10px">${cardHTML(c, true, own)}<p class="t">${own ? c.d + '<br><br>Desliza el dedo sobre la carta para girarla.' : 'Aún no la has encontrado. Busca en los cofres.'}</p></div>`); cardDrag(document.querySelector('.modal')); },
  legend: () => modal(`<h3>Leyenda de las puertas</h3><div class="col">${Object.values(ROOMS).map(r => `<div class="row">${sp(r.ico, 4)}<div><b style="font-size:9px;font-weight:normal">${r.n === '¿?' ? 'Evento' : r.n}</b><p class="t">${r.d}</p></div></div>`).join('')}</div>`),
  tapEnemy: i => {
    const e = C && C.en[i]; if (!e || e.hp <= 0) return;
    if (C.phase === 'use' && C.sel && !C.busy) {
      const f = effFaces().fs[DKEYS.indexOf(C.sel)];
      if (validTarget(f, e)) { if (Tuto.expect('use:' + C.sel)) useDie(C.sel, e); return; }
      return toast(targetType(f) === 'guard' ? 'Ese enemigo no ataca' : targetType(f) === 'self' ? 'Este dado es para ti' : 'Ahí no');
    }
    if (C.phase === 'roll') return G.roll();
    if (Tuto.on) return;
    modal(`<h3>${e.n}</h3>${pips(e.hp, e.max, { blk: e.block, cls: 'mid' })}<p class="t">Ahora: <span style="color:var(--txt)">${e.intent ? intentText(e.intent, e) : 'todavía no ha tirado'}</span></p><p class="t">Caras de su dado:</p><div class="col">${e.f.map((s, k) => `<p class="t" style="color:${k === e.die ? 'var(--gold)' : 'var(--txt)'}">${k === e.die ? '▶' : '·'} ${intentText(parseFace(s), e)}</p>`).join('')}</div>${e.boom ? `<p class="t" style="color:#f08a2a">Al morir explota: ${e.boom} de daño a todos.</p>` : ''}${e.spines ? `<p class="t" style="color:#c0d0ff">Pinchos: cada vez que le pegas te hace ${e.spines} de daño.</p>` : ''}${e.grow ? `<p class="t" style="color:#ff7050">Crece: cada turno pega ${e.grow} más.</p>` : ''}${e.multi > 1 ? `<p class="t" style="color:#ff8a8a">Tres cabezas: su ataque golpea ${e.multi} veces.</p>` : ''}${e.phase ? `<p class="t" style="color:#d090ff">A media vida se transforma en ${EN[e.phase].n}.</p>` : ''}${e.regrow ? `<p class="t" style="color:#7aea7a">Si queda otra cabeza viva, vuelve a crecer (${e.regrow} vez).</p>` : ''}${e.stolen ? `<p class="t" style="color:var(--gold)">Te ha robado ${e.stolen} de oro: mátalo y lo recuperas.</p>` : ''}`);
  },
  tapHero: () => {
    if (!C) return;
    if (C.phase === 'use' && C.sel && !C.busy) { const f = effFaces().fs[DKEYS.indexOf(C.sel)]; if (validTarget(f, 'hero')) { if (Tuto.expect('use:' + C.sel)) useDie(C.sel, 'hero'); return; } return toast('Este dado va a un enemigo'); }
    if (C.phase === 'roll') G.roll();
  },
  tapFloor: () => { if (C && C.phase === 'roll') G.roll(); },
  myDice: () => modal(`<h3>Tus dados</h3>${diceRows()}<p class="t">${run.dice.esp.concat(run.dice.atk, run.dice.def).filter(f => !blankF(f)).map(f => f.k).filter((k, i, a) => a.indexOf(k) === i).map(k => `<b style="color:${KW[k].col}">${KW[k].n}</b>: ${KW[k].x('N')}`).join('<br>')}</p>`),
  relic: k => modal(`<div class="row">${sp(RELICS[k].ico, 5, RELICS[k].sw)}<h3>${RELICS[k].n}</h3></div><p class="t">${RELICS[k].d}</p>`),
  pf: (d, i) => { const cfg = S.pf; if (cfg) cfg.on(d, i); },
  pfCancel: () => { const cfg = S.pf; if (cfg && cfg.cancel) cfg.cancel(); },
  altar: d => { run.dice[d].forEach(f => f.v++); toast(`¡${DN(d)} +1!`); nextRoom(); },
  rest: i => { if (i === 0) { heal(S.heal); toast('Zzz...'); nextRoom(); } else pickFace({ title: 'Entrenar', ico: 'yunque', sub: '+1 a la cara que elijas.', dice: ['atk', 'def', 'esp'], on: (d, j) => { if (!upF(d, j)) return; toast('+1'); nextRoom(); } }); },
  buy: i => {
    const sh = S.shop, it = sh[i]; if (!it || it.sold || run.gold < it.p) return;
    const back = () => { S = { scr: 'shop', shop: sh }; shop(); };
    if (it.t === 'st') return stickerFlow(it.s, () => { run.gold -= it.p; it.sold = 1; back(); }, back);
    if (it.t === 'up') return pickFace({ title: 'Mejora', ico: 'yunque', sub: '+1 a la cara que elijas.', dice: ['atk', 'def', 'esp'], cancel: back, on: (d, j) => { if (!upF(d, j)) return; run.gold -= it.p; it.sold = 1; toast('+1'); back(); } });
    run.gold -= it.p; it.sold = 1;
    if (it.t === 'heal') heal(it.n);
    if (it.t === 'relic') { run.relics.push(it.k); RELICS[it.k].on && RELICS[it.k].on(run); }
    shop();
  },
  leaveShop: () => nextRoom(),
  evo: async i => {
    if (S.scr !== 'event' || S.busy) return;
    const o = S.ev.o[i]; if (o.req && !o.req(run)) return;
    S.busy = true; document.querySelectorAll('#evopts .btn').forEach(b => { b.disabled = true; });
    const res = o.play ? await o.play(run) : o.f(run);
    S.busy = false;
    if (typeof res === 'string') evResult(res, null); else evResult(res.msg, res.next);
  },
  evnext: () => { const n = S.next; n ? n() : nextRoom(); },
  over: () => gameOver(),
  offer: i => {
    const o = S.offers[i];
    if (o.t === 'up') return pickFace({ title: `Mejorar ${DN(o.d)}`, ico: KW[run.dice[o.d][0].k].ico, sub: '+1 a la cara que elijas.', dice: [o.d], on: (d, j) => { if (!upF(d, j)) return; toast('+1'); nextRoom(); } });
    if (o.t === 'st') return stickerFlow(o.s, nextRoom);
    if (o.t === 'heal') heal(o.n);
    if (o.t === 'max') { run.maxHp += o.n; run.hp += o.n; }
    nextRoom();
  },
  takeRelic: k => { const after = S.after; run.relics.push(k); RELICS[k].on && RELICS[k].on(run); toast(RELICS[k].n); after(); },
  evolve: i => { const o = S.opts[i], after = S.after; o.a(run); run.cls = o.n; run.evo = (run.evo || []).concat(evoId(o.n)); toast(`¡${o.n}!`); after(); },
  // para el bot de pruebas
  _s: () => ({ S, C, run }),
  _fast: v => { FAST = v; },
};
window.G = G; window.Tuto = Tuto; window.Tips = Tips;
// transición corta al cambiar de pantalla
let lastScr = '';
new MutationObserver(() => {
  if (FAST || S.scr === lastScr) return;
  lastScr = S.scr; Coach.draw();
  app.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'steps(5)' });
}).observe(app, { childList: true });
title();
</script>
