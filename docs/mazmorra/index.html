<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mazmorra de Dados</title>
<meta name="apple-mobile-web-app-title" content="Mazmorra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120e18">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e18;--panel:#1f1828;--line:#3a2e4a;--txt:#f4f0e8;--dim:#a597b8;--gold:#f8d84a;--red:#e04848;--blue:#4a8ae8;--green:#5ad05a;--dc:#f08a2a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--txt);font-family:'Press Start 2P',ui-monospace,monospace;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{background-color:var(--bg);background-image:linear-gradient(#ffffff05 2px,transparent 2px),linear-gradient(90deg,#ffffff05 2px,transparent 2px);background-size:32px 16px}
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.btn{font:inherit;font-size:10px;color:var(--txt);background:#2a2036;border:3px solid var(--txt);padding:13px 12px;cursor:pointer;box-shadow:0 4px 0 #000;text-align:center;line-height:1.6;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.pri{background:#7a2030;border-color:#ff9a9a}
.btn.gold{background:#5a4210;border-color:var(--gold)}
.btn.small{font-size:8px;padding:9px;border-width:2px;color:var(--dim);border-color:var(--line);background:transparent;box-shadow:none}
.btn:disabled{opacity:.35;pointer-events:none}
.t{font-size:8px;line-height:2;color:var(--dim);margin:0}
.c{text-align:center}
h1{font-size:22px;line-height:1.5;margin:0;text-align:center;color:var(--gold);text-shadow:3px 3px 0 #7a2030}
h2{font-size:12px;margin:0;line-height:1.6}
h3{font-size:10px;margin:0;line-height:1.6;color:var(--gold)}
.panel{background:var(--panel);border:3px solid var(--line);padding:12px}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.trio{display:flex;justify-content:center;gap:14px;align-items:flex-end}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:9px;gap:6px}
.hud span{display:flex;align-items:center;gap:6px}
.bar{height:12px;background:#000;border:2px solid #000;outline:2px solid #3a2e4a;position:relative;width:100%}
.bar i{display:block;height:100%;background:var(--red)}
.bar b{position:absolute;inset:0;font-size:7px;line-height:9px;text-align:center;font-weight:normal;text-shadow:1px 1px 0 #000}
.steps{display:flex;gap:5px;justify-content:center}
.steps i{width:22px;height:8px;background:#2a2036;border:2px solid #000}
.steps i.done{background:#7a6a90}.steps i.now{background:var(--gold)}.steps i.boss{background:#7a2030}
/* dados */
.drow{display:flex;align-items:center;gap:4px}
.drow .lb{width:62px;font-size:6px;color:var(--dim);line-height:1.5;flex:none}
.fc{width:37px;height:37px;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;position:relative;flex:none;color:var(--txt);font-family:inherit;padding:0}
.fc.atk{border-color:#e04848;background:#3a1218}.fc.def{border-color:#4a8ae8;background:#121e3a}.fc.esp{border-color:var(--dc);background:#2a2010}
.fc.blank b{color:#5a5068}
button.fc{cursor:pointer}
button.fc:active{transform:scale(.9)}
.pick .fc.off{opacity:.25;pointer-events:none}
.die{width:86px;height:86px;font-size:18px;border-width:4px;box-shadow:0 5px 0 #000;gap:6px}
.die.boost b{color:var(--gold)!important}
.die.can{cursor:pointer}
.die.q b{color:#5a5068}
.dice{display:flex;justify-content:center;gap:14px}
.dlab{display:flex;justify-content:center;gap:14px}
.dlab span{width:86px;text-align:center;font-size:7px;color:var(--dim)}
.combo{text-align:center;font-size:13px;color:var(--gold);text-shadow:2px 2px 0 #7a2030;min-height:16px}
.ftxt{font-size:8px;line-height:2;color:var(--dim);min-height:48px;text-align:center}
.ftxt em{font-style:normal;color:var(--txt)}
/* combate */
.arena{border:3px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:14px;position:relative}
.enemies{display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:150px}
.en{display:flex;flex-direction:column;align-items:center;gap:5px;width:31%;max-width:140px;cursor:pointer;padding:6px 2px;border:2px solid transparent}
.en.tgt{border-color:var(--gold)}
.en.dead{opacity:.2;filter:grayscale(1)}
.en .nm{font-size:7px;text-align:center;line-height:1.4}
.intent{display:flex;gap:6px;font-size:10px;min-height:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.intent span{display:flex;align-items:center;gap:2px}
.badges{display:flex;gap:6px;font-size:8px;min-height:14px;flex-wrap:wrap;justify-content:center}
.badges span{display:flex;align-items:center;gap:2px}
.herorow{display:flex;align-items:center;gap:12px;padding:0 6px}
.hstat{flex:1;display:flex;flex-direction:column;gap:6px}
.acts{display:flex;flex-direction:column;gap:8px}
/* puertas */
.doors{display:flex;gap:8px}
.door{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;font-size:9px}
.door small{font-size:7px;color:var(--dim);line-height:1.6}
.relics{display:flex;gap:6px;flex-wrap:wrap}
.relics button{background:#0006;border:2px solid var(--line);padding:3px;cursor:pointer}
.opt{display:flex;align-items:center;gap:12px;text-align:left}
.opt small{display:block;font-size:7px;color:var(--dim);margin-top:4px}
.opt .price{margin-left:auto;color:var(--gold);white-space:nowrap}
.hero-card{display:flex;gap:12px;align-items:center;text-align:left}
.hero-card .info{flex:1;display:flex;flex-direction:column;gap:6px}
.hero-card small{font-size:7px;color:var(--dim);line-height:1.7}
/* efectos */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.fl{position:absolute;font-size:14px;text-shadow:2px 2px 0 #000;animation:up .9s steps(9) forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-220%);opacity:0}}
.shake{animation:sh .3s steps(3)}
@keyframes sh{33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:16px;color:var(--gold);text-shadow:3px 3px 0 #7a2030;z-index:60;animation:pop 1s steps(5) forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6)}20%{transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
.modal{position:fixed;inset:0;background:#000c;z-index:70;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .panel{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.help p{font-size:8px;line-height:2.1;color:var(--dim);margin:0}
.help b{color:var(--txt);font-weight:normal}
</style>
</head>

  const key = name + '|' + (swap || '');

  const g = SPR[name] || ICO[name];
  const w = Math.max(...g.map(r => r.length)), h = g.length;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d'), sw = swap ? SWAPS[swap] : null;
  g.forEach((row, y) => { for (let i = 0; i < row.length; i++) { let ch = row[i]; if (sw && sw[ch]) ch = sw[ch]; if (PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, y, 1, 1); } } });

}
function sp(name, px, swap, cls = '') {
  const g = SPR[name] || ICO[name]; if (!g) return '';
  const w = Math.max(...g.map(r => r.length));
  return `<img class="px ${cls}" src="${sprURL(name, swap)}" width="${w * px}" height="${g.length * px}" alt="">`;

  };

function wpick(w) { let t = 0; for (const k in w) t += w[k]; let x = Math.random() * t; for (const k in w) { x -= w[k]; if (x < 0) return k; } return Object.keys(w)[0]; }
function genDoors(s) {
  if (s === STEPS - 1) return ['jefe'];
  if (s === 0) return ['combate'];
  const w = { combate: 34, evento: 20, forja: 11, altar: 5, elite: s >= 2 ? 12 : 0, descanso: s >= 3 ? 9 : 0, tienda: s >= 2 ? 10 : 0 };
  const n = Math.random() < .55 ? 3 : 2, out = [];
  if (s === STEPS - 2) out.push('descanso');
  while (out.length < n) { const t = wpick(w); if (!out.includes(t)) out.push(t); }
  return shuffle(out);
}

function bar(v, m, col) { const p = Math.max(0, Math.min(100, v / m * 100)); return `<div class="bar"><i style="width:${p}%;${col ? 'background:' + col : ''}"></i><b>${Math.max(0, v)}/${m}</b></div>`; }
function hud() {

}
function faceHTML(f, d, opts = {}) {
  const tag = opts.click ? 'button' : 'div';
  const on = opts.click ? ` onclick="${opts.click}"` : '';
  const cls = `fc ${d} ${blankF(f) ? 'blank' : ''} ${opts.cls || ''}`;
  if (blankF(f)) return `<${tag} class="${cls}"${on}><b>·</b></${tag}>`;
  const kw = KW[f.k], px = opts.big ? 4 : 2;
  return `<${tag} class="${cls}"${on}>${sp(kw.ico, px)}<b style="color:${kw.col}">${f.k === 'doble' && !f.v ? '' : f.v}</b></${tag}>`;
}
function diceRows(opts = {}) {
  return `<div class="col ${opts.pick ? 'pick' : ''}">${['atk', 'def', 'esp'].map(d => `<div class="drow"><div class="lb">${DN(d)}</div>${run.dice[d].map((f, i) => {
    if (!opts.pick) return faceHTML(f, d);
    const ok = opts.pick.includes(d);
    return faceHTML(f, d, { click: ok ? `G.pf('${d}',${i})` : '', cls: ok ? '' : 'off' });
  }).join('')}</div>`).join('')}</div>`;
}
function relicsHTML() {
  if (!run.relics.length) return '<p class="t">Sin reliquias</p>';

function modal(html) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="panel">${html}<button class="btn" onclick="this.closest('.modal').remove()">Cerrar</button></div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
}
let fxq = [];
function fl(target, txt, col, shake) { fxq.push({ target, txt, col, shake }); }
function flushFx() {
  for (const q of fxq) {
    let el = null;
    if (q.target === 'hero') el = $('#hero');
    else if (C) { const i = C.en.indexOf(q.target); if (i >= 0) el = $('#en' + i); }
    if (!el) continue;
    if (q.shake) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    if (q.txt) {
      const r = el.getBoundingClientRect(), d = document.createElement('div');
      d.className = 'fl'; d.textContent = q.txt; d.style.color = q.col || '#fff';
      d.style.left = (r.left + r.width / 2 + R(-12, 12)) + 'px'; d.style.top = (r.top + r.height * .4) + 'px';
      fxl.appendChild(d); setTimeout(() => d.remove(), 950);

  }
  fxq = [];

}

function parseFace(s) {
  const o = { a: 0, b: 0, p: 0, h: 0, r: 0, s: null };
  const m = s.match(/s:(\w+)/); if (m) o.s = m[1];
  s.replace(/s:\w+/, '').replace(/([abphr])(\d+)/g, (_, k, n) => { o[k] += +n; });
  return o;
}
function makeEnemy(key) {
  const d = EN[key];
  return { key, n: d.n, spr: d.spr || key, swap: d.swap, px: d.px || 5, hp: d.hp, max: d.hp, block: 0, poison: 0, rage: 0, intent: null, f: d.f };
}
function startCombat(kind) {
  const fl = FLOORS[run.floor];
  let list;
  if (kind === 'jefe') list = [fl.boss];
  else if (kind === 'elite') list = [pick(fl.elite)];
  else {
    let n = run.step < 2 ? 1 : Math.random() < (run.floor ? .65 : .5) ? 2 : 1;
    if (run.floor > 0 && run.step >= 2 && Math.random() < .3) n++;
    list = Array.from({ length: n }, () => pick(fl.pool));
  }
  C = { kind, en: list.map(makeEnemy), turn: 0, block: 0, thorns: 0, ppoison: 0, rolled: null, rerolls: 0, target: 0, busy: false };
  startTurn(); cRender();
}
function startTurn() {
  C.turn++; C.block = has('escudo') ? 1 : 0; C.thorns = 0; C.rolled = null;
  C.rerolls = 1 + (has('trebol') ? 1 : 0);
  for (const e of C.en) { e.intent = parseFace(pick(e.f)); e.block = e.intent.b; }
  if (C.target >= C.en.length) C.target = 0;
}
function rollDie(d) {
  let f = pick(run.dice[d]);
  if (has('cargado') && blankF(f)) f = pick(run.dice[d]);
  return { ...f };
}
function effFaces() {
  const fs = ['atk', 'def', 'esp'].map(d => ({ ...C.rolled[d], d, b: 0 }));
  let combo = '';
  const v = fs.map(f => f.v);
  if (v[0] > 0 && v[0] === v[1] && v[1] === v[2]) { fs.forEach(f => { f.b = f.v; f.v *= 2; }); combo = '¡Trío! ×2'; }
  else {
    const b = has('gemelo') ? 2 : 1;
    outer: for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++)
      if (fs[i].v > 0 && fs[i].v === fs[j].v) { fs[i].v += b; fs[j].v += b; fs[i].b = fs[j].b = b; combo = `¡Pareja! +${b}`; break outer; }
  }
  let furia = 0, hits = 1;
  for (const f of fs) { if (f.k === 'furia') furia += f.v; if (f.k === 'doble') { furia += f.v; hits = 2; } }
  if (C.turn === 1 && has('brasa')) furia += 2;
  return { fs, combo, furia, hits };
}

  amt = Math.min(amt, Math.max(0, e.hp));

    C.en = C.en.filter(e => e.hp > 0);
    if (has('calavera') && C.en.length) {
      for (let k = 0; k < dead.length; k++) for (const e of C.en) hitEnemy(e, 2, true, '#e0e0f0');
      cRender(); await sleep(350);
    }
    dead = C.en.filter(e => e.hp <= 0);
  }
  if (C.target >= C.en.length) C.target = 0;
  return C.en.length === 0;
}
async function act() {
  if (C.busy || !C.rolled) return;
  C.busy = true;
  const eff = effFaces();
  if (eff.combo) toast(eff.combo);
  const step = async (ms = 330) => { cRender(); await sleep(ms); };
  // 1) protección, cura y veneno
  for (const f of eff.fs) {
    if (blankF(f)) continue;
    if (f.k === 'escudo' || f.k === 'espinas') { C.block += f.v; if (f.k === 'espinas') C.thorns += f.v; fl('hero', '+' + f.v, '#8ab8ff'); }
    else if (f.k === 'luz') { const h = heal(f.v); if (h) fl('hero', '+' + h, '#7aea7a'); if (f.v > h) { C.block += f.v - h; fl('hero', '+' + (f.v - h), '#8ab8ff'); } }
    else if (f.k === 'veneno') { const e = tgtEnemy(); e.poison += f.v + (has('seta') ? 1 : 0); fl(e, '+' + (f.v + (has('seta') ? 1 : 0)), '#7aea7a'); }
    else if (f.k === 'nube') { for (const e of alive()) { e.poison += f.v + (has('seta') ? 1 : 0); fl(e, '+' + (f.v + (has('seta') ? 1 : 0)), '#7aea7a'); } }
  }
  if (fxq.length) await step();
  // 2) daño
  for (const f of eff.fs) {
    const kw = KW[f.k];
    if (!kw.dmg || f.v <= 0) continue;
    for (let h = 0; h < eff.hits; h++) {
      if (!alive().length) break;
      const amt = f.v + eff.furia, targets = kw.all ? alive() : [tgtEnemy()];
      for (const e of targets) { const dealt = hitEnemy(e, amt, kw.pierce, f.k === 'fuego' ? '#ffb040' : null); if (kw.vamp && dealt) { const hh = heal(dealt); if (hh) fl('hero', '+' + hh, '#7aea7a'); } }
      await step();
    }
  }
  if (await cleanup()) return winCombat();
  // 3) el veneno hace daño
  let pz = false;
  for (const e of alive()) if (e.poison > 0) { hitEnemy(e, e.poison, true, '#7aea7a'); e.poison--; pz = true; }
  if (pz) await step();
  if (await cleanup()) return winCombat();
  // 4) turno de los enemigos
  await sleep(200);
  for (const e of [...C.en]) {
    if (e.hp <= 0) continue;
    const it = e.intent;
    if (it.a) {
      let dmg = it.a + e.rage; const ab = Math.min(C.block, dmg); C.block -= ab; dmg -= ab;
      run.hp -= dmg; fl('hero', dmg > 0 ? '-' + dmg : 'BLOQUEO', dmg > 0 ? '#ff6a6a' : '#8ab8ff', dmg > 0);
      fl(e, '', null, true);
      if (C.thorns) hitEnemy(e, C.thorns, true, '#c0d0ff');
    }
    if (it.p) { C.ppoison += it.p; fl('hero', '+' + it.p, '#7aea7a'); }
    if (it.h) for (const o of alive()) { const hh = Math.min(it.h, o.max - o.hp); o.hp += hh; if (hh) fl(o, '+' + hh, '#7aea7a'); }
    if (it.r) { e.rage += it.r; fl(e, 'FURIA', '#ff7050'); }
    if (it.s && alive().length < 3) { const m = makeEnemy(it.s); m.intent = parseFace('a0'); C.en.push(m); fl(m, '¡!', '#d0a0ff'); }
    await step(380);
    if (run.hp <= 0) return lose();
  }
  if (await cleanup()) return winCombat();
  // 5) tu veneno
  if (C.ppoison > 0) { run.hp -= C.ppoison; fl('hero', '-' + C.ppoison, '#7aea7a', true); C.ppoison--; await step(); if (run.hp <= 0) return lose(); }
  startTurn(); C.busy = false; cRender();
}
async function winCombat() {
  await sleep(350);
  const kind = C.kind;
  let g = kind === 'jefe' ? 40 + run.floor * 10 : kind === 'elite' ? 20 + run.floor * 5 : R(6, 10) + run.floor * 3;
  if (has('bolsa')) g = Math.round(g * 1.5);
  run.gold += g;
  if (has('colmillo')) heal(4);
  C = null;
  if (kind === 'jefe') {
    run.hp = run.maxHp;
    if (run.floor >= FLOORS.length - 1) return victory();
    return evolve(() => relicChoice('Tesoro del jefe', nextFloor));
  }
  if (kind === 'elite') return relicChoice(`¡Élite vencido! +${g} de oro`, nextRoom);
  reward(g);
}
async function lose() { await sleep(500); C = null; gameOver(); }

// ---------------------------------------------------------- acciones (botones)
const G = {
  title, choose: chooseHero, help, map,
  start: k => newRun(k),
  cont: () => { run = load(); if (!run) return title(); map(); },
  door: i => enter(run.doors[i]),
  roll: () => doRoll(),
  rr: d => reroll(d),
  act: () => act(),
  tgt: i => {
    if (!C || !C.en[i] || C.en[i].hp <= 0) return;
    if (C.target === i || C.en.length === 1) {
      const e = C.en[i];
      modal(`<h3>${e.n}</h3><p class="t">Vida ${e.hp}/${e.max}. Sus caras:</p><div class="col">${e.f.map(s => `<p class="t" style="color:var(--txt)">· ${intentText(parseFace(s), e)}</p>`).join('')}</div>`);
    } else { C.target = i; cRender(); }
  },
  myDice: () => modal(`<h3>Tus dados</h3>${diceRows()}<p class="t">${run.dice.esp.concat(run.dice.atk, run.dice.def).filter(f => !blankF(f)).map(f => f.k).filter((k, i, a) => a.indexOf(k) === i).map(k => `<b style="color:${KW[k].col}">${KW[k].n}</b>: ${KW[k].x('N')}`).join('<br>')}</p>`),
  relic: k => modal(`<div class="row">${sp(RELICS[k].ico, 5, RELICS[k].sw)}<h3>${RELICS[k].n}</h3></div><p class="t">${RELICS[k].d}</p>`),
  pf: (d, i) => { const cfg = S.pf; if (cfg) cfg.on(d, i); },
  pfCancel: () => { const cfg = S.pf; if (cfg && cfg.cancel) cfg.cancel(); },
  altar: d => { run.dice[d].forEach(f => f.v++); toast(`¡${DN(d)} +1!`); nextRoom(); },
  rest: i => { if (i === 0) { heal(S.heal); toast('Zzz...'); nextRoom(); } else pickFace({ title: 'Entrenar', ico: 'yunque', sub: '+1 a la cara que elijas.', dice: ['atk', 'def', 'esp'], on: (d, j) => { run.dice[d][j].v++; toast('+1'); nextRoom(); } }); },
  buy: i => {
    const sh = S.shop, it = sh[i]; if (!it || it.sold || run.gold < it.p) return;
    const back = () => { S = { scr: 'shop', shop: sh }; shop(); };
    if (it.t === 'st') return stickerFlow(it.s, () => { run.gold -= it.p; it.sold = 1; back(); }, back);
    if (it.t === 'up') return pickFace({ title: 'Mejora', ico: 'yunque', sub: '+1 a la cara que elijas.', dice: ['atk', 'def', 'esp'], cancel: back, on: (d, j) => { run.dice[d][j].v++; run.gold -= it.p; it.sold = 1; toast('+1'); back(); } });
    run.gold -= it.p; it.sold = 1;
    if (it.t === 'heal') heal(it.n);
    if (it.t === 'relic') { run.relics.push(it.k); RELICS[it.k].on && RELICS[it.k].on(run); }
    shop();
  },
  leaveShop: () => nextRoom(),
  evo: i => {
    const o = S.ev.o[i]; if (o.req && !o.req(run)) return;
    const res = o.f(run);
    if (typeof res === 'string') evResult(res, null); else evResult(res.msg, res.next);
  },
  evnext: () => { const n = S.next; n ? n() : nextRoom(); },
  over: () => gameOver(),
  offer: i => {
    const o = S.offers[i];
    if (o.t === 'up') return pickFace({ title: `Mejorar ${DN(o.d)}`, ico: KW[run.dice[o.d][0].k].ico, sub: '+1 a la cara que elijas.', dice: [o.d], on: (d, j) => { run.dice[d][j].v++; toast('+1'); nextRoom(); } });
    if (o.t === 'st') return stickerFlow(o.s, nextRoom);
    if (o.t === 'heal') heal(o.n);
    if (o.t === 'max') { run.maxHp += o.n; run.hp += o.n; }
    nextRoom();
  },
  takeRelic: k => { const after = S.after; run.relics.push(k); RELICS[k].on && RELICS[k].on(run); toast(RELICS[k].n); after(); },
  evolve: i => { const o = S.opts[i], after = S.after; o.a(run); run.cls = o.n; toast(`¡${o.n}!`); after(); },
  // para el bot de pruebas
  _s: () => ({ S, C, run }),
  _fast: v => { FAST = v; },
};
window.G = G;
title();
</script>
